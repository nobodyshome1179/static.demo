const PAL={classic:[['墨黑配黃',INK,YEL,WHT],['鈷藍配白',COB,WHT,YEL],['亮黃配墨',YEL,INK,COB],['信號紅配墨',RED,INK,WHT],['白底配墨',WHT,INK,RED],['奶油配藍',CRM,INK,COB]],
  luxe:[['象牙香檳金',LXC.IV,LXC.ESP,LXC.CHA],['瓷白鉑金',LXC.POR,LXC.GRA,LXC.PLA],['裸粉玫瑰金',LXC.BLU,LXC.TAU,LXC.ROS],['沙岩古銅',LXC.SAN,LXC.UMB,LXC.BRZ],['霧藍淡金',LXC.MIS,LXC.NAV,LXC.GLD],['鼠尾草綠',LXC.SAG,LXC.FOR,LXC.MOS]],
  formal:[['深藍白字',FMC.NAVY,FMC.WHITE,FMC.TEAL],['白底深藍',FMC.WHITE,FMC.INK,FMC.BLUE],['淺灰石板',FMC.MIST,FMC.SLATE,FMC.TEAL2],['深灰金',FMC.CHAR,FMC.OFF,FMC.GOLD],['學院綠',FMC.SGB,FMC.FOR,FMC.GRN],['酒紅',FMC.CRB,FMC.WINE,FMC.BUR]]};
const palOf=sc=>PAL[(MG_MAP[sc.fx]||{}).col]||PAL.classic;
const colStyle=fx=>fx.col==='luxe'?MG_LUXE_STYLE:fx.col==='formal'?MG_FORMAL_STYLE:'';
const FONT_OPTS=[['sans','粗黑體'],['serif','粗明體'],['elegant','雅緻襯線'],['thin','細黑體'],['clean','端正黑體']];
const FONT_LABEL={sans:'粗黑體',serif:'粗明體',elegant:'細襯線（英文 Cormorant Garamond、中文思源宋體 Light）',thin:'細黑體（思源黑體 Light）',clean:'端正黑體（思源黑體 Medium，標題用 Bold）'};
const colFx=fx=>MG_FX.filter(f=>f.col===fx.col);
const ICON_PAUSE='<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1" width="3" height="10"/><rect x="7.5" y="1" width="3" height="10"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z"/></svg>';
const $=s=>document.querySelector(s);
const sid=()=>'s'+Math.random().toString(36).slice(2,9);
const fmt=s=>{s=Math.max(0,s);const m=Math.floor(s/60),r=(s%60).toFixed(1).padStart(4,'0');return `${String(m).padStart(2,'0')}:${r}`;};
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- state ---------- */
function makeScene(fxId,p={},extra={}){const fx=MG_MAP[fxId];const sc={id:sid(),rev:0,fx:fxId,p:Object.assign({speed:1,k:1,font:fx.d.font||'sans'},clone(fx.d),p),trans:'cut',lock:false,...extra};
  if(sc.dur==null)sc.dur=mgDur(fx,mgResolve(sc));return sc;}
function demo(){return{aspect:'16:9',scenes:[
  makeScene('lx-hair',{text:'新品發表',text2:'Collection 2026'}),
  makeScene('flap',{list:['今晚八點','線上直播'],bg:LXC.IV,fg:'#FFFFFF',ac:LXC.ESP,font:'elegant'},{dur:8.4,trans:'fade',lock:true,fontLock:true}),
  makeScene('lx-sweep',{text:'限量典藏'},{trans:'fade'}),
  makeScene('odo',{num:300,text:'限量',text2:'組',bg:LXC.IV,fg:LXC.ESP,ac:LXC.SAN,font:'elegant'},{trans:'fade',lock:true,fontLock:true}),
  makeScene('lx-under',{text:'立即預約'},{trans:'fade'})]};}
function sanitize(d){
  if(!d||!Array.isArray(d.scenes))return null;
  const scenes=d.scenes.filter(s=>s&&MG_MAP[s.fx]).slice(0,60).map(s=>{const fx=MG_MAP[s.fx];const p=Object.assign({speed:1,k:1,font:fx.d.font||'sans'},clone(fx.d),typeof s.p==='object'&&s.p?s.p:{});
    return{id:sid(),rev:0,fx:s.fx,p,dur:clamp(+s.dur||mgDur(fx,mgResolve({fx:s.fx,p})),.5,60),trans:s.trans==='fade'?'fade':'cut',lock:!!s.lock,fontLock:!!s.fontLock};});
  if(!scenes.length)return null;return{aspect:ASPECTS.some(a=>a[0]===d.aspect)?d.aspect:'16:9',scenes};
}
const serial=()=>({v:1,aspect:state.aspect,scenes:state.scenes.map(s=>({fx:s.fx,p:s.p,dur:s.dur,trans:s.trans,lock:s.lock,fontLock:!!s.fontLock}))});
function load(){try{const raw=localStorage.getItem(KEY);return raw?sanitize(JSON.parse(raw)):null;}catch(e){return null;}}
let saveT=0;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(serial()));}catch(e){}},400);}

let state=load()||demo();let sel=0;
const cur=()=>state.scenes[sel];

/* ---------- player ---------- */
const host=$('#host');
const player=new MGPlayer(host,{aspect:state.aspect,onTick});
player.setScenes(state.scenes);player.playAll(0);player.active=false;

/* ---------- top bar ---------- */
const aspectSel=$('#aspect');aspectSel.innerHTML=ASPECTS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');aspectSel.value=state.aspect;
aspectSel.addEventListener('change',()=>{state.aspect=aspectSel.value;player.setAspect(state.aspect);save();});
const btnPlay=$('#btnPlay');
const paintPlay=()=>{btnPlay.innerHTML=player.playing?`${ICON_PAUSE}暫停`:`${ICON_PLAY}播放`;};
btnPlay.addEventListener('click',()=>{player.playing=!player.playing;paintPlay();});paintPlay();
$('#btnAll').addEventListener('click',()=>{player.playAll(0);paintPlay();});
$('#btnFull').addEventListener('click',()=>{const r=host.requestFullscreen?host.requestFullscreen():null;if(r&&r.catch)r.catch(()=>toast('這個環境不允許全螢幕，匯出網頁後再試'));});

/* export menu */
const btnExport=$('#btnExport'),menu=$('#exportMenu');
const closeMenu=()=>{menu.hidden=true;btnExport.setAttribute('aria-expanded','false');};
btnExport.addEventListener('click',e=>{e.stopPropagation();menu.hidden=!menu.hidden;btnExport.setAttribute('aria-expanded',String(!menu.hidden));});
document.addEventListener('click',e=>{if(!menu.hidden&&!menu.contains(e.target))closeMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
menu.addEventListener('click',async e=>{const b=e.target.closest('button[data-act]');if(!b)return;closeMenu();const act=b.dataset.act;
  if(act==='html')download('motion.html',buildHTML(),'text/html');
  else if(act==='copyhtml')copy(buildHTML(),'已複製網頁原始碼');
  else if(act==='json')download('motion.json',JSON.stringify(serial(),null,2),'application/json');
  else if(act==='prompts')copy(state.scenes.map((s,i)=>`【第 ${i+1} 幕，約 ${s.dur} 秒】\n`+promptOf(s)).join('\n\n'),'已複製全部提示詞');
  else if(act==='import')$('#fileIn').click();
  else if(act==='reset'){if(confirm('換回範例內容？目前的場景會被取代。')){state=demo();sel=0;player.setAspect(state.aspect);aspectSel.value=state.aspect;player.setScenes(state.scenes);player.playAll(0);renderAll();save();}}
});
$('#fileIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const txt=await f.text();let d;const m=txt.match(/<script id="mg-data" type="application\/json">([\s\S]*?)<\/script>/);d=JSON.parse(m?m[1]:txt);
    const s=sanitize(d);if(!s)throw new Error('empty');state=s;sel=0;aspectSel.value=state.aspect;player.setAspect(state.aspect);player.setScenes(state.scenes);player.playAll(0);renderAll();save();toast(`已匯入 ${s.scenes.length} 個場景`);}
  catch(err){toast('讀不到場景資料：請選這個工作台匯出的 .json 或 .html');}
});

/* ---------- scene list ---------- */
const list=$('#sceneList');
function snippet(sc){const P=mgResolve(sc),fx=MG_MAP[sc.fx],k=primaryK(fx);return k==='list'?P.list.join('／'):k==='num'?`${P.text}${P.num}${P.text2}`:P.text+(fx.fields.some(f=>f.k==='text2')?'／'+P.text2:'');}
function renderList(){
  $('#sceneCount').textContent=`${state.scenes.length} 幕・${fmt(player.total)}`;
  list.innerHTML=state.scenes.map((sc,i)=>{const fx=MG_MAP[sc.fx],P=mgResolve(sc),ch=[...P.text.trim()||P.list[0]||'字'][0];
    return `<li><button class="scn${i===sel?' on':''}" data-i="${i}" aria-current="${i===sel}"><span class="sw" style="background:${P.bg};color:${P.fg};border-bottom-color:${P.ac}">${esc(ch)}</span><span class="scn-t"><b>${i+1}. ${fx.zh}</b><small>${MG_COLS.find(c=>c.id===fx.col).short}・${fx.en}</small><em>${esc(snippet(sc))}</em></span><span class="scn-d">${(+sc.dur).toFixed(1)}s</span></button></li>`;}).join('');
  const n=state.scenes.length;$('#actUp').disabled=sel===0;$('#actDown').disabled=sel===n-1;$('#actDel').disabled=n<=1;
}
list.addEventListener('click',e=>{const b=e.target.closest('.scn');if(!b)return;sel=+b.dataset.i;player.select(sel);player.playing=true;paintPlay();renderList();renderInspector();renderTimeline();});
function move(d){const j=sel+d;if(j<0||j>=state.scenes.length)return;const a=state.scenes;[a[sel],a[j]]=[a[j],a[sel]];sel=j;changed(true);player.select(sel);}
$('#actUp').addEventListener('click',()=>move(-1));$('#actDown').addEventListener('click',()=>move(1));
$('#actDup').addEventListener('click',()=>{const c=clone(cur());c.id=sid();c.rev=0;state.scenes.splice(sel+1,0,c);sel++;changed(true);player.select(sel);renderInspector();});
$('#actDel').addEventListener('click',()=>{if(state.scenes.length<=1)return;state.scenes.splice(sel,1);sel=Math.min(sel,state.scenes.length-1);changed(true);player.select(sel);renderInspector();});
$('#addScene').addEventListener('click',()=>{const c=cur(),order=MG_FX.map(f=>f.id),nx=order[(order.indexOf(c.fx)+1)%order.length];const sc=makeScene(nx);carry(c,sc);sc.lock=c.lock;if(c.lock){sc.p.bg=c.p.bg;sc.p.fg=c.p.fg;sc.p.ac=c.p.ac;}
  state.scenes.splice(sel+1,0,sc);sel++;changed(true);player.select(sel);renderInspector();});

/* carry the words from one scene into another effect's fields */
const primaryK=mgPrimary;
function contentOf(sc){const P=mgResolve(sc),fx=MG_MAP[sc.fx],k=primaryK(fx);if(k==='list')return P.list.slice();if(k==='num')return[];const o=[P.text];if(fx.fields.some(f=>f.k==='text2'))o.push(P.text2);return o;}
function carry(from,to){const c=contentOf(from).filter(s=>String(s).trim());if(!c.length)return;const fx=MG_MAP[to.fx];mgApplyWords(fx,to.p,c);to.dur=mgDur(fx,mgResolve(to));}
function changeFx(id){const old=cur(),fx=MG_MAP[id];const sc=makeScene(id,{},{id:old.id,trans:old.trans,lock:old.lock});sc.rev=(old.rev||0)+1;
  sc.p.speed=old.p.speed;sc.p.k=old.p.k;if(old.lock){sc.p.bg=old.p.bg;sc.p.fg=old.p.fg;sc.p.ac=old.p.ac;}if(old.fontLock){sc.p.font=old.p.font;sc.fontLock=true;}
  carry(old,sc);state.scenes[sel]=sc;changed(true);player.select(sel);renderInspector();}

/* ---------- timeline ---------- */
const segs=$('#segs'),ph=$('#ph'),tl=$('#tl');
function renderTimeline(){const tot=player.total||1;segs.innerHTML=state.scenes.map((sc,i)=>{const fx=MG_MAP[sc.fx],P=mgResolve(sc);return `<div class="seg" data-i="${i}" style="flex:${sc.dur} 1 0"><i style="background:${P.bg}"></i><b>${i+1} ${fx.zh}</b><small>${(+sc.dur).toFixed(1)}s</small></div>`;}).join('');}
let lastSeg=-1;
function onTick({i,t,T,total,mode}){
  if(!total)return;const start=state.scenes.slice(0,i).reduce((a,s)=>a+(+s.dur),0),pos=mode==='all'?T:start+t;
  ph.style.left=(pos/total*100).toFixed(3)+'%';
  if(i!==lastSeg){lastSeg=i;segs.querySelectorAll('.seg').forEach((s,k)=>s.classList.toggle('on',k===i));list.querySelectorAll('.scn').forEach((s,k)=>s.classList.toggle('live',k===i&&mode==='all'));}
  $('#modeLabel').textContent=mode==='all'?`播放全部，目前第 ${i+1} 幕`:`循環預覽第 ${i+1} 幕`;
  $('#timeLabel').textContent=mode==='all'?`${fmt(T)} / ${fmt(total)}`:`${fmt(t)} / ${fmt(+state.scenes[i].dur)}`;
}
let scrub=null;
const tAt=e=>{const r=tl.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width)*player.total;};
tl.addEventListener('pointerdown',e=>{tl.setPointerCapture(e.pointerId);scrub={was:player.playing};player.playing=false;player.seek(tAt(e));const i=player.locate().i;if(i!==sel){sel=i;renderList();renderInspector();}});
tl.addEventListener('pointermove',e=>{if(scrub)player.seek(tAt(e));});
const endScrub=()=>{if(!scrub)return;player.playing=scrub.was;scrub=null;paintPlay();const i=player.locate().i;if(i!==sel){sel=i;renderList();renderInspector();}};
tl.addEventListener('pointerup',endScrub);tl.addEventListener('pointercancel',endScrub);

/* ---------- inspector ---------- */
const insp=$('#insp');
function promptOf(sc){const fx=MG_MAP[sc.fx],P=mgResolve(sc),c=contentOf(sc);const words=primaryK(fx)==='num'?`${P.text}${P.num}${P.text2}`:c.map(s=>`「${s}」`).join('、');
  return `請做一段「${fx.zh}（${fx.en}）」文字動畫，文字用${words}。\n畫面比例 ${state.aspect==='fill'?'隨容器自適應':state.aspect}；背景 ${P.bg}、主色 ${P.fg}、輔色 ${P.ac}；字體用${FONT_LABEL[P.font]||'黑體'}；這一段長約 ${sc.dur} 秒。\n效果：${fx.how}${colStyle(fx)}`;}
function field(f,P){const id='f_'+f.k;
  if(f.k==='list')return `<label class="fld"><span>${f.label}</span><textarea id="${id}" data-k="list" rows="${Math.min(6,Math.max(2,P.list.length+1))}">${esc(Array.isArray(cur().p.list)?cur().p.list.join('\n'):cur().p.list??'')}</textarea></label>`;
  if(f.k==='num')return `<label class="fld"><span>${f.label}</span><input id="${id}" data-k="num" type="number" min="0" max="9999999999" step="1" value="${esc(cur().p.num??P.num)}"></label>`;
  return `<label class="fld"><span>${f.label}</span><input id="${id}" data-k="${f.k}" type="text" maxlength="40" value="${esc(cur().p[f.k]??'')}"></label>`;}
const rng=(k,label,min,max,step,val,unit)=>`<label class="rng"><span>${label}</span><input type="range" data-r="${k}" min="${min}" max="${max}" step="${step}" value="${val}"><output>${(+val).toFixed(unit==='s'?1:2)}${unit}</output></label>`;

  insp.innerHTML=`
  <div class="grp"><h3>第 ${sel+1} 幕的招式</h3><select id="fxSel" aria-label="招式">${opts}</select>
    <div class="fxnav"><button class="btn" type="button" data-nav="-1">上一招</button><button class="btn" type="button" data-nav="1">下一招</button><button class="btn" type="button" data-nav="r">隨機換一招</button></div>
    <p class="fxdesc"><em class="colbadge ${fx.col}">${MG_COLS.find(c=>c.id===fx.col).short}</em><span lang="en">${fx.en}</span>　${fx.how}</p><button class="link" type="button" id="seeAll">到特效總覽看其他招式</button></div>
  <div class="grp"><h3>內容</h3>${fx.fields.map(f=>field(f,P)).join('')}</div>
  <div class="grp"><h3>顏色</h3>${['classic','luxe','formal'].map(k=>`<div class="pal-h">${{classic:'經典配色',luxe:'精品配色',formal:'研討會配色'}[k]}</div><div class="pal">${PAL[k].map(([n,b,f,a],i)=>`<button type="button" data-pal="${k}:${i}" title="${n}" aria-label="${n}" style="background:${b};color:${f}">字<i style="background:${a}"></i></button>`).join('')}</div>`).join('')}
    <div class="colors">${[['bg','背景'],['fg','主色'],['ac','輔色']].map(([k,l])=>`<label>${l}<input type="color" data-c="${k}" value="${P[k]}"><code>${P[k].toUpperCase()}</code></label>`).join('')}</div>

  <div class="grp"><h3>動態</h3>${rng('speed','速度',.25,3,.05,P.speed,'×')}${rng('k','字級',.5,1.6,.05,P.k,'×')}
    <label class="row2"><span>字體</span><select data-sel="font" aria-label="字體">${FONT_OPTS.map(([v,l])=>`<option value="${v}"${v===P.font?' selected':''}>${l}</option>`).join('')}</select></label></div>
  <div class="grp"><h3>時間</h3>${rng('dur','長度',.5,20,.1,sc.dur,'s')}
    <div class="row2"><span>進場轉場</span>${seg2('trans',[['cut','直接切'],['fade','淡入']],sc.trans)}</div>

  <div class="grp"><h3>整支影片</h3><p class="grp-note">混搭兩種風格時，用這裡把這一幕的設定套到每一幕，讓整支影片看起來是同一套。</p>
    <div class="unify"><button class="btn" type="button" id="uniColor">配色套用到全部</button><button class="btn" type="button" id="uniFont">字體套用到全部</button><button class="btn" type="button" id="uniFade">全部改成淡入轉場</button></div></div>
  <div class="grp"><button class="btn wide" type="button" id="copyPrompt">複製這一幕的提示詞</button></div>`;
}
insp.addEventListener('change',e=>{if(e.target.id==='fxSel')changeFx(e.target.value);else if(e.target.dataset.sel==='font'){cur().p.font=e.target.value;cur().fontLock=true;bump();}});
insp.addEventListener('input',e=>{const el=e.target,sc=cur();
  if(el.dataset.k){sc.p[el.dataset.k]=el.dataset.k==='num'?Number(el.value):el.value;bump();}
  else if(el.dataset.c){sc.p[el.dataset.c]=el.value;sc.lock=true;el.nextElementSibling.textContent=el.value.toUpperCase();bump();}
  else if(el.dataset.r){const k=el.dataset.r,v=+el.value;el.nextElementSibling.textContent=v.toFixed(k==='dur'?1:2)+(k==='dur'?'s':'×');
    if(k==='dur'){sc.dur=v;changed();}else{sc.p[k]=v;bump();}}
});
insp.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const sc=cur();
  if(b.dataset.nav){const A=MG_FX,n=A.length,i=A.findIndex(f=>f.id===sc.fx);let j=b.dataset.nav==='r'?(i+1+Math.floor(Math.random()*(n-1)))%n:(i+(+b.dataset.nav)+n)%n;changeFx(A[j].id);}

/* ---------- video export: render each frame offline, encode with WebCodecs ---------- */
const VDIMS={'16:9':[1920,1080],'9:16':[1080,1920],'1:1':[1080,1080],'4:5':[1080,1350],'21:9':[2520,1080],'fill':[1920,1080]};
const vopt={range:'all',res:'1080',fps:30};
const dlg=$('#vidDlg'),vInfo=$('#vidInfo'),vGo=$('#vidGo'),vCancel=$('#vidCancel'),vDl=$('#vidDl'),vOut=$('#vidOut'),vProg=$('#vidProgWrap'),vBar=$('#vidBar'),vPct=$('#vidPct'),vNote=$('#vidNote');

const vDims=()=>{const[w,h]=VDIMS[state.aspect]||VDIMS['16:9'];const k=vopt.res==='720'?2/3:1;return[Math.round(w*k/2)*2,Math.round(h*k/2)*2];};

async function pickCodec(W,H,fps){
  if(typeof VideoEncoder==='undefined')return null;
  const bitrate=Math.round(clamp(W*H*fps*.09,2e6,24e6));
  const tryC=async(codec,extra={})=>{try{const r=await VideoEncoder.isConfigSupported({codec,width:W,height:H,bitrate,framerate:fps,...extra});return r.supported;}catch(e){return false;}};
  for(const c of['avc1.640034','avc1.640033','avc1.640032','avc1.640028','avc1.4D4034','avc1.42E034'])if(await tryC(c,{avc:{format:'avc'}}))return{fmt:'mp4',codec:c,mux:'avc',label:'MP4（H.264）',bitrate,extra:{avc:{format:'avc'}}};
  for(const c of['vp09.00.41.08','vp09.00.10.08'])if(await tryC(c))return{fmt:'webm',codec:c,mux:'V_VP9',label:'WebM（VP9）',bitrate,extra:{}};
  if(await tryC('vp8'))return{fmt:'webm',codec:'vp8',mux:'V_VP8',label:'WebM（VP8）',bitrate,extra:{}};

}
async function updateVInfo(){const[W,H]=vDims(),list=vScenes(),dur=list.reduce((a,s)=>a+(+s.dur),0),n=Math.round(dur*vopt.fps);

  vNote.textContent=c&&c.fmt==='webm'?'這個瀏覽器沒有 H.264 編碼器，會輸出 WebM。需要 MP4 時請用 Chrome 或 Edge。':state.aspect==='fill'?'「填滿畫面」比例會以 16:9 輸出。':'';}
$('#btnVideo').addEventListener('click',()=>{closeMenu();player.playing=false;paintPlay();resetVDialog();dlg.showModal();updateVInfo();});

/* fonts: copy the web-font slices the scenes need into each frame (font files only; nothing about the content is sent) */
let fontCache={key:'',css:'',ok:false};
function rangeHits(ur,cps){for(const part of ur.split(',')){const m=part.trim().replace(/^U\+/i,'');let a,b;
  if(m.includes('?')){a=parseInt(m.replace(/\?/g,'0'),16);b=parseInt(m.replace(/\?/g,'F'),16);}else if(m.includes('-')){[a,b]=m.split('-').map(x=>parseInt(x,16));}else{a=b=parseInt(m,16);}
  for(const c of cps)if(c>=a&&c<=b)return true;}return false;}
const toDataURL=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob);});
async function fetchT(url,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return r;}finally{clearTimeout(t);}}
async function fontCSS(list){
  let text='0123456789,・•·　 N°';const need=new Map(),add=(fam,ws,it)=>{const e=need.get(fam)||{w:new Set(),it:false};ws.forEach(w=>e.w.add(w));if(it)e.it=true;need.set(fam,e);};
  for(const sc of list){const P=mgResolve(sc),fx=MG_MAP[sc.fx]||{};text+=P.text+P.text2+P.list.join('')+String(P.num??'');if(sc.fx==='flap'||sc.fx==='slot')text+='東西南北台中高雄新竹站車班次延誤準點月日時分福財喜旺樂發吉金寶ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const m=fontMeta(P.font);m.fams.forEach(f=>add(f,[m.w].concat(sc.fx==='type'?[700]:[]),P.font==='elegant'));
    if(fx.col==='formal'){add('Noto Sans TC',[400,500,700]);add('Archivo',[500,600,700,800]);text+='KEYNOTE SPEAKER LIVE NOW NEXT →←↑↓↗↘↙↖“”—%:'+String(P.text).toUpperCase()+String(P.text2).toUpperCase();}
    if(fx.col==='luxe'){add('Cormorant Garamond',[300,400,500],true);add('Noto Serif TC',[300,400,500]);add('Noto Sans TC',[300,400]);text+=String(P.text).toUpperCase()+String(P.text2).toUpperCase();}
    if(sc.fx==='odo')add('Archivo',[500,800]);}
  const cps=new Set([...text].map(c=>c.codePointAt(0))),key=[...cps].sort().join(',')+'|'+[...need].map(([f,e])=>f+[...e.w].join('.')+e.it).join(';');
  if(fontCache.key===key)return fontCache;
  const out={key,css:'',ok:false};
  try{const link=document.querySelector('link[href*="fonts.googleapis.com/css2"]');if(!link)throw 0;
    const css=await (await fetchT(link.href,6000)).text();const want=[];
    for(const m of css.matchAll(/@font-face\s*\{([^}]*)\}/g)){const b=m[1],fam=(b.match(/font-family:\s*'([^']+)'/)||[])[1],wt=((b.match(/font-weight:\s*([^;]+);/)||[])[1]||'400').trim().split(/\s+/).map(Number),it=/font-style:\s*italic/.test(b),url=(b.match(/url\(([^)]+)\)/)||[])[1],ur=(b.match(/unicode-range:\s*([^;]+);/)||[])[1];
      const e=fam&&need.get(fam);if(!e||!url)continue;if(it&&!e.it)continue;const lo=wt[0],hi=wt[1]??wt[0];if(![...e.w].some(w=>w>=lo&&w<=hi))continue;if(ur&&!rangeHits(ur,cps))continue;want.push({b,url});}
    if(!want.length||want.length>120)throw 0;let total=0;const parts=[];
    for(let i=0;i<want.length;i+=6){const chunk=await Promise.all(want.slice(i,i+6).map(async w=>{const blob=await (await fetchT(w.url,8000)).blob();total+=blob.size;return `@font-face{${w.b.replace(/url\([^)]+\)/,'url('+await toDataURL(blob)+')')}}`;}));parts.push(...chunk);if(total>16e6)throw 0;}
    out.css=parts.join('\n');out.ok=true;}catch(e){out.css='';out.ok=false;}
  fontCache=out;return out;
}

/* one frame: clone the live stage, freeze animated values, wrap it in SVG, decode as an image */
const LIBCSS=document.getElementById('mg-lib-css').textContent;
async function rasterize(L,W,H,css){
  const src=L.el,clone=src.cloneNode(true),a=[src,...src.querySelectorAll('*')],b=[clone,...clone.querySelectorAll('*')],anim=new Map();
  for(const an of(L.anims||[])){const tg=an.effect&&an.effect.target;if(!tg)continue;const ps=anim.get(tg)||new Set();an.effect.getKeyframes().forEach(k=>Object.keys(k).forEach(p=>{if(!['offset','computedOffset','easing','composite'].includes(p))ps.add(p);}));anim.set(tg,ps);}

    if(o.tagName==='CANVAS'){const img=document.createElement('img');img.src=o.toDataURL();img.setAttribute('style','position:absolute;inset:0;width:100%;height:100%;display:block');c.replaceWith(img);continue;}
    const ps=anim.get(o);if(ps){const cs=getComputedStyle(o);ps.forEach(p=>{const k=p.replace(/[A-Z]/g,m=>'-'+m.toLowerCase());c.style.setProperty(k,cs.getPropertyValue(k));});}}

  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject x="0" y="0" width="${W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:${W}px;height:${H}px;overflow:hidden"><style><![CDATA[${css}\n*{animation:none!important;transition:none!important}]]></style>${html}</div></foreignObject></svg>`;
  const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await img.decode();return img;
}

vGo.addEventListener('click',async()=>{
  if(vBusy)return;const[W,H]=vDims(),fps=vopt.fps,list=vScenes().map(s=>JSON.parse(JSON.stringify(s))),codec=await pickCodec(W,H,fps);if(!codec)return;
  const durs=list.map(s=>+s.dur),total=durs.reduce((a,b)=>a+b,0),N=Math.max(1,Math.round(total*fps));
  vBusy=true;vAbort=false;vGo.hidden=true;vCancel.textContent='停止';vProg.hidden=false;vBar.style.width='0%';vPct.textContent='準備字型…';
  dlg.querySelectorAll('button[data-vo]').forEach(b=>b.disabled=true);
  const box=document.createElement('div');box.style.cssText=`position:fixed;left:-40000px;top:0;width:${W}px;height:${H}px;overflow:hidden;pointer-events:none`;box.setAttribute('aria-hidden','true');document.body.append(box);

    const target=codec.fmt==='mp4'?new Mp4Muxer.ArrayBufferTarget():new WebMMuxer.ArrayBufferTarget();
    const muxer=codec.fmt==='mp4'?new Mp4Muxer.Muxer({target,video:{codec:'avc',width:W,height:H,frameRate:fps},fastStart:'in-memory',firstTimestampBehavior:'offset'})

    enc=new VideoEncoder({output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),error:e=>{err=e;}});
    enc.configure({codec:codec.codec,width:W,height:H,bitrate:codec.bitrate,framerate:fps,...codec.extra});

    const prev=document.createElement('canvas');prev.width=W;prev.height=H;const pctx=prev.getContext('2d');

      while(enc.encodeQueueSize>6){await new Promise(r=>setTimeout(r,4));if(err)throw err;}

    }
    vPct.textContent='封裝檔案…';await enc.flush();muxer.finalize();
    const blob=new Blob([target.buffer],{type:codec.fmt==='mp4'?'video/mp4':'video/webm'});vUrl=URL.createObjectURL(blob);
    const name=`motion-${W}x${H}-${fps}fps.${codec.fmt}`;vDl.href=vUrl;vDl.download=name;vDl.hidden=false;vOut.src=vUrl;vOut.hidden=false;
    vPct.textContent=`完成：${name}，${(blob.size/1048576).toFixed(1)} MB${fonts.ok?'':'（字型使用電腦內建字型）'}`;vBar.style.width='100%';
  }catch(e){vPct.textContent=e&&e.message==='abort'?'已停止輸出。':`輸出失敗：${e&&e.message||e}`;vGo.hidden=false;vGo.textContent='重新輸出';}
  finally{try{if(enc&&enc.state!=='closed')enc.close();}catch(_){}mgUnmount(L);box.remove();vBusy=false;vCancel.textContent='關閉';dlg.querySelectorAll('button[data-vo]').forEach(b=>b.disabled=false);}
});

const COL_KEY='mg-mix-catalog-col';
const HERO={classic:{lede:'提示詞只寫「讓字動起來」，AI 多半只給你淡入淡出。每一種字幕動態都有名字，<b>把名字寫進提示詞，做出來的就是那一招。</b>每張卡片都能直接複製提示詞，或按「用這招製作」送進工作台細修。'},
  formal:{lede:'給研討會、論壇與企業活動用的 40 種文字動態：講者字卡、議程、數據、致謝都有。端正的黑體、等寬數字、清楚的資訊層次，節奏穩定不花俏。<b>名稱一樣可以直接寫進提示詞</b>，複製的提示詞會附上正式場合的風格描述。'},
  luxe:{lede:'給高單價品牌用的 40 種文字動態：淺色底、細襯線字、髮絲線與金屬光澤，節奏放慢、留白充足。<b>名稱一樣可以直接寫進提示詞</b>，複製的提示詞會附上精品風格的描述。'}};

/* ---------- bar height → sticky offsets ---------- */
const bar=$('#bar');
new ResizeObserver(()=>document.documentElement.style.setProperty('--barh',bar.offsetHeight+'px')).observe(bar);

/* ---------- overview ---------- */
const main=$('#c-main'),nav=$('#c-nav'),toggle=$('#c-toggle'),wordsIn=$('#c-words');
let playing=!reduce,words=[],col='classic';
const COLS=['classic','luxe','formal'];try{const v=localStorage.getItem(COL_KEY);col=COLS.includes(v)?v:'classic';}catch(e){}
if(HASH0==='#luxe'||HASH0==='#formal')col=HASH0.slice(1);
try{wordsIn.value=localStorage.getItem(TXT_KEY)||'';}catch(e){}
words=mgSplitWords(wordsIn.value);
const cards=[];

function sceneFor(fx){const p=clone(fx.d);if(words.length)mgApplyWords(fx,p,words);return{fx:fx.id,p};}
function clone(o){return JSON.parse(JSON.stringify(o));}
function promptFor(fx){const P=mgResolve(sceneFor(fx)),k=mgPrimary(fx);
  const w=k==='list'?P.list.map(s=>`「${s}」`).join('、'):k==='num'?`「${P.text}${P.num}${P.text2}」`:`「${P.text}」`+(fx.fields.some(f=>f.k==='text2')?`、「${P.text2}」`:'');
  const lx=fx.col!=='classic'?`\n配色：背景 ${P.bg}、文字 ${P.fg}、點綴 ${P.ac}。${fx.col==='luxe'?MG_LUXE_STYLE:MG_FORMAL_STYLE}`:'';
  return `請做一段「${fx.zh}（${fx.en}）」文字動畫，文字用${w}。\n效果：${fx.how}${lx}`;}

MG_CATS.forEach(cat=>{
  const list=MG_FX.filter(f=>f.cat===cat.id),from=list[0].no,to=list[list.length-1].no;
  nav.insertAdjacentHTML('beforeend',`<a href="#c-${cat.id}" data-cat="${cat.id}" data-col="${cat.col}">${cat.zh}<small lang="en">${cat.en}</small></a>`);
  const sec=document.createElement('section');sec.className='c-sec';sec.id='c-'+cat.id;sec.dataset.col=cat.col;
  sec.innerHTML=`<div class="c-wrap"><div class="c-head"><h2>${cat.zh}</h2><span class="en" lang="en">${cat.en}</span><span class="range">${cat.col==='luxe'?'精品 ':cat.col==='formal'?'研討會 ':''}${String(from).padStart(2,'0')}–${String(to).padStart(2,'0')}</span><p>${CAT_DESC[cat.id]}</p></div><div class="c-grid"></div></div>`;
  main.append(sec);const grid=sec.querySelector('.c-grid');
  list.forEach(fx=>{
    const art=document.createElement('article');art.className='c-card';art.id='fx-'+fx.id;
    art.innerHTML=`<div class="c-stage" role="img" aria-label="${fx.zh}（${fx.en}）示範"></div>
      <div class="c-meta"><span class="no">${String(fx.no).padStart(2,'0')}</span><div class="nm"><h3>${fx.zh}</h3><span class="en" lang="en">${fx.en}</span></div>
      <p class="desc">${fx.desc} <span class="use">適合${fx.use}。</span></p>
      <div class="acts"><button class="btn sm" type="button" data-copy>複製提示詞</button><button class="btn sm ghost" type="button" data-make>用這招製作 →</button></div></div>`;
    grid.append(art);
    const card={fx,art,stage:art.querySelector('.c-stage'),L:null,visible:false,t:0};card.stage.__card=card;cards.push(card);
    art.querySelector('[data-copy]').addEventListener('click',()=>copy(promptFor(fx),'已複製提示詞'));
    art.querySelector('[data-make]').addEventListener('click',()=>{window.MGStudio.addEffect(fx.id,words);show('studio');});
  });
});

function mount(card){const r=card.stage.getBoundingClientRect();if(!r.width)return;card.L=mgMount(card.stage,sceneFor(card.fx),r.width,r.height);card.L.lt=reduce?1.2:card.t;mgRender(card.L);}
function remountAll(){cards.forEach(c=>{mgUnmount(c.L);c.L=null;c.t=0;if(c.visible)mount(c);});}
const io=new IntersectionObserver(es=>es.forEach(e=>{const c=e.target.__card;c.visible=e.isIntersecting;if(c.visible&&!c.L)mount(c);}),{rootMargin:'160px 0px'});
const ro=new ResizeObserver(es=>es.forEach(e=>{const c=e.target.__card;if(c.L){c.L.inst.w=e.contentRect.width;c.L.inst.h=e.contentRect.height;}}));
cards.forEach(c=>{io.observe(c.stage);ro.observe(c.stage);});

let wt=0;wordsIn.addEventListener('input',()=>{clearTimeout(wt);wt=setTimeout(()=>{words=mgSplitWords(wordsIn.value);try{localStorage.setItem(TXT_KEY,wordsIn.value);}catch(e){}remountAll();},220);});
$('#c-clear').addEventListener('click',()=>{wordsIn.value='';words=[];try{localStorage.removeItem(TXT_KEY);}catch(e){}remountAll();wordsIn.focus();});

const ICON_PAUSE='<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1" width="3" height="10"/><rect x="7.5" y="1" width="3" height="10"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z"/></svg>';
const paint=()=>{toggle.innerHTML=playing?`${ICON_PAUSE}暫停全部`:`${ICON_PLAY}播放全部`;toggle.setAttribute('aria-pressed',String(!playing));};
toggle.addEventListener('click',()=>{playing=!playing;paint();});paint();

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing&&document.body.dataset.view==='catalog')for(const c of cards){if(c.visible&&c.L){c.t+=dt;c.L.lt=c.t;try{mgRender(c.L);}catch(e){}}}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);

/* collection switch */
const view=$('#view-catalog'),colBtns=[...document.querySelectorAll('[data-col-pick]')];
function setCol(c,keepScroll){col=c;view.dataset.col=c;try{localStorage.setItem(COL_KEY,c);}catch(e){}
  document.querySelectorAll('.c-sec').forEach(s=>{s.hidden=s.dataset.col!==c;});nav.querySelectorAll('a').forEach(a=>{a.hidden=a.dataset.col!==c;});
  colBtns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.colPick===c)));$('#c-lede').innerHTML=HERO[c].lede;
  try{if(routed&&document.body.dataset.view==='catalog')history.replaceState(null,'',c==='classic'?'#catalog':'#'+c);}catch(e){}
  if(!keepScroll){const top=$('.c-nav');if(top&&window.scrollY>top.offsetTop)window.scrollTo(0,top.offsetTop);}}
colBtns.forEach(b=>b.addEventListener('click',()=>setCol(b.dataset.colPick)));
setCol(col,true);

/* category highlight */
const links=[...nav.querySelectorAll('a')];
const spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.toggle('on',a.dataset.cat===e.target.id.slice(2)));const on=nav.querySelector('a.on');if(on&&nav.scrollWidth>nav.clientWidth)nav.scrollTo({left:on.offsetLeft-nav.offsetLeft-16,behavior:reduce?'auto':'smooth'});}}),{rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('.c-sec').forEach(s=>spy.observe(s));

/* hero counter */
let rolled=false;
function roll(){if(rolled)return;rolled=true;document.querySelectorAll('.roll .d').forEach(d=>{const to=+d.dataset.to,loop=+d.dataset.loop,s=d.firstElementChild;
  s.innerHTML=Array.from({length:30},(_,i)=>`<i>${i%10}</i>`).join('');const idx=loop*10+to;
  if(reduce){s.style.transition='none';s.style.transform=`translateY(${-idx/30*100}%)`;return;}
  requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.transform=`translateY(${-idx/30*100}%)`;}));});}

/* ---------- copy + toast (overview) ---------- */
async function copy(text,msg){let ok=false;try{await navigator.clipboard.writeText(text);ok=true;}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.append(ta);ta.select();try{ok=document.execCommand('copy');}catch(_){}ta.remove();}
  const t=$('#toast');t.textContent=ok?msg:'複製失敗，請檢查瀏覽器的剪貼簿權限';t.classList.add('on');clearTimeout(copy.t);copy.t=setTimeout(()=>t.classList.remove('on'),2000);}

/* ---------- router ---------- */
const views={catalog:$('#view-catalog'),studio:$('#view-studio')};
const tabs=[...document.querySelectorAll('[data-view]')];
let scrollY0=0;
function show(v,focusFx){
  const cur=document.body.dataset.view;if(cur==='catalog')scrollY0=window.scrollY;
  document.body.dataset.view=v;Object.entries(views).forEach(([k,el])=>{el.hidden=k!==v;});
  tabs.forEach(b=>b.setAttribute('aria-current',b.dataset.view===v?'page':'false'));
  document.querySelectorAll('[data-for]').forEach(el=>{el.hidden=el.dataset.for!==v;});
  try{history.replaceState(null,'',v==='studio'?location.pathname+location.search:(col==='classic'?'#catalog':'#'+col));}catch(e){}
  if(v==='studio'){window.scrollTo(0,0);window.MGStudio.onShow();}
  else{window.MGStudio.onHide();roll();
    if(focusFx&&MG_MAP[focusFx]&&MG_MAP[focusFx].col!==col)setCol(MG_MAP[focusFx].col,true);
    if(focusFx){const el=document.getElementById('fx-'+focusFx);if(el){el.scrollIntoView({block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}}
    else window.scrollTo(0,scrollY0);}
}
tabs.forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));
window.MGApp={show};
show(['#catalog','#luxe','#formal'].includes(HASH0)?'catalog':'studio');routed=true;
})();

</script>
</body>
</html>
