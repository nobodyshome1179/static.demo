<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字動態混搭工作台｜經典＋精品＋研討會 120 招</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style id="mg-lib-css">
.mg-host{position:relative;display:grid;place-items:center;overflow:hidden}
.mg-frame{position:relative;overflow:hidden}
.mg-stage{
  --sans:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif;
  --elegant:"Cormorant Garamond","Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif;
  --thin:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;--fw:900;
  --k:1;--ff:var(--sans);--bg:#171B26;--fg:#fff;--ac:#FFD60A;
  --mute:color-mix(in srgb,var(--fg) 14%,var(--bg));
  position:absolute;inset:0;overflow:hidden;container-type:size;isolation:isolate;
  background:var(--bg);color:var(--fg);font-family:var(--ff);font-weight:var(--fw);line-height:1;
  -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
.mg-stage b{font-weight:var(--fw)}
.mg-stage .lx-one{white-space:nowrap}
.mg-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mg-stage .fill{position:absolute;inset:0;display:grid;place-items:center}
.mg-stage .fill>*{grid-area:1/1}
.mg-stage .mq{display:flex;width:max-content;white-space:nowrap;animation:mg-mq var(--d,10s) linear infinite}
.mg-stage .mq.rev{animation-direction:reverse}
.mg-stage .mq>span{flex:none}
@keyframes mg-mq{to{transform:translateX(-50%)}}
.mg-stage .vcol{height:100%;overflow:hidden;flex:none}
.mg-stage .vmq{display:flex;flex-direction:column;animation:mg-vmq var(--d,10s) linear infinite}
.mg-stage .vmq.rev{animation-direction:reverse}
.mg-stage .vmq span{writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;line-height:1.08}
@keyframes mg-vmq{to{transform:translateY(-50%)}}

/* Word Burst */
.e-burst b{animation:mg-burst 2.2s cubic-bezier(.2,.9,.3,1.25) infinite both;white-space:nowrap}
.e-burst i{position:absolute;left:50%;top:50%;width:1.4cqmin;height:8cqmin;margin:-4cqmin 0 0 -.7cqmin;border-radius:1cqmin;background:var(--ac);animation:mg-spark 2.2s cubic-bezier(.1,.7,.3,1) infinite both}
@keyframes mg-burst{0%{transform:scale(.15);opacity:0}12%{transform:scale(1.22);opacity:1}22%{transform:scale(.96)}30%,78%{transform:scale(1);opacity:1}92%,100%{transform:scale(1.08);opacity:0}}
@keyframes mg-spark{0%,7%{transform:rotate(var(--a)) translateY(-14cqmin) scaleY(.2);opacity:0}11%{opacity:1}36%,100%{transform:rotate(var(--a)) translateY(calc(-1 * var(--d))) scaleY(.5);opacity:0}}

/* Letter Sequence / Zoom / Squeeze */
.e-js b{white-space:nowrap;will-change:transform}

/* Text Stamp */
.e-stamp{position:absolute;inset:0}
.e-stamp b{position:absolute;color:var(--fg);border:.09em solid currentColor;border-radius:.15em;padding:.2em .33em;letter-spacing:.06em;white-space:nowrap;animation:3.6s cubic-bezier(.3,1.5,.5,1) infinite both}

/* Punch Zoom */
.e-punch b{white-space:nowrap;animation:mg-punch 2.4s cubic-bezier(.16,.84,.26,1) infinite both}
.e-punch b.g{filter:blur(.012em);animation-name:mg-punchg}
@keyframes mg-punch{0%{transform:scale(.05);opacity:0}16%{transform:scale(1.14);opacity:1}24%{transform:scale(1)}76%{transform:scale(1);opacity:1}90%,100%{transform:scale(2.4);opacity:0}}
@keyframes mg-punchg{0%{transform:scale(.05);opacity:0}16%{transform:scale(1.14);opacity:1}24%{transform:scale(1);opacity:.6}32%,80%{transform:scale(1);opacity:0}84%{opacity:1}90%,100%{transform:scale(2.4);opacity:0}}

/* Kinetic Stack */
.e-stack .col{display:flex;flex-direction:column;align-items:center;gap:.12em}
.e-stack b{display:block;white-space:nowrap;animation:3.4s cubic-bezier(.2,.9,.2,1) infinite both}

/* Stretch Text */
.e-stretch div{display:flex;gap:.02em;align-items:flex-end;transform:translateY(.26em)}
.e-stretch b{display:block;transform-origin:50% 100%;animation:mg-stretch 1.8s cubic-bezier(.3,.7,.3,1) infinite both}
@keyframes mg-stretch{0%,10%{transform:scale(1,1)}28%{transform:scale(.88,1.5)}44%{transform:scale(1.1,.82)}58%{transform:scale(.97,1.08)}70%,100%{transform:scale(1,1)}}

/* Huge Text Scroll */
.e-huge .big{position:absolute;left:0;color:var(--fg)}
.e-huge .strip{position:absolute;left:0;right:0;bottom:4cqh;color:var(--ac);padding-top:.18em;border-top:max(2px,.045em) solid var(--ac)}

/* columns */
.e-cols{position:absolute;inset:0;display:flex;justify-content:space-around}
.e-par{position:absolute;inset:0}
.e-par .layer{position:absolute;inset:0;display:flex;justify-content:space-around}

/* Repeating Text */
.e-rep{position:absolute;inset:-3cqh -6cqw;display:flex;flex-direction:column;justify-content:space-around}
.e-rep div{display:flex;gap:.22em;white-space:nowrap}
.e-rep div:nth-child(odd){transform:translateX(-.55em)}
.e-rep span{color:var(--mute);animation:mg-wave 2.8s ease-in-out infinite}
@keyframes mg-wave{0%,46%,100%{color:var(--mute)}16%{color:var(--ac)}26%{color:var(--fg)}}

/* Diagonal Text Bands */
.e-bands .band{position:absolute;left:-30%;right:-30%;padding:.19em 0;overflow:hidden;color:var(--fg)}
.e-bands .b1{background:var(--ac);transform:rotate(-8deg)}
.e-bands .b2{background:#fff;transform:rotate(6deg)}

/* Marquee */
.e-marq{position:absolute;inset:0;display:flex;flex-direction:column}
.e-marq .r{flex:1;display:flex;align-items:center;overflow:hidden;color:var(--fg)}
.e-marq .r.dk{background:var(--fg);color:var(--ac)}

/* Tape Cross */
.e-tape .tape{position:absolute;left:-40%;right:-40%;top:50%;background:var(--ac);color:var(--fg);padding:.38em 0;overflow:hidden}
.e-tape .tape::before,.e-tape .tape::after{content:"";position:absolute;left:0;right:0;height:.18em;background:repeating-linear-gradient(-45deg,var(--fg) 0 .17em,var(--ac) .17em .34em)}
.e-tape .tape::before{top:0}
.e-tape .tape::after{bottom:0}

/* Text Tunnel */
.e-tunnel{background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--fg) 22%,transparent),transparent 62%)}
.e-tunnel .fr{border:.045em solid var(--fg);border-radius:.18em;padding:.18em .36em;color:var(--fg);white-space:nowrap;will-change:transform,opacity}

/* Text Cylinder */
.e-cyl{position:absolute;inset:0;display:flex;justify-content:space-evenly;align-items:center}
.e-cyl .cyl{width:var(--cw);height:calc(var(--cw) * .8667);perspective:calc(var(--cw) * 5)}
.e-cyl .drum{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.e-cyl .face{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw) * .66);color:var(--fg);background:var(--bg);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset 0 0 0 calc(var(--cw) * .012) color-mix(in srgb,var(--fg) 12%,var(--bg))}
.e-cyl .face.hot{background:var(--ac);color:var(--bg);box-shadow:none}
@keyframes mg-spinx{to{transform:rotateX(360deg)}}

/* Text Vortex */
.e-vortex b{color:var(--fg);white-space:nowrap;will-change:transform}
.e-vortex b.g{color:transparent;-webkit-text-stroke:.007em var(--ac)}

/* Text Orbit */
.e-orbit-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.e-orbit-svg ellipse{animation:mg-dash 3s linear infinite}
@keyframes mg-dash{to{stroke-dashoffset:-22}}
.e-orbit{position:absolute;left:0;top:0;color:var(--fg);white-space:nowrap;will-change:transform}

/* Text Cube */
.e-cube{perspective:calc(var(--cs) * 3.5)}
.e-cube .cube{position:relative;width:var(--cs);height:var(--cs);transform-style:preserve-3d}
.e-cube .cf{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:var(--ac);white-space:nowrap;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.e-cube .cf.d{background:var(--fg)}
.e-cube .cf.cap{background:color-mix(in srgb,var(--fg) 12%,#fff)}

/* Extrude Text */
.e-ext .ex{display:grid;transform-style:preserve-3d}
.e-ext .ex b{grid-area:1/1;white-space:nowrap}

/* Split Flap */
.e-flap{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:calc(var(--tw) * .08)}
.e-flap .tile{position:relative;width:var(--tw);height:calc(var(--tw) * 1.33);perspective:calc(var(--tw) * 2.7);font-size:calc(var(--tw) * .84)}
.e-flap .h{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--fg);color:var(--ac);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.e-flap .h span{position:absolute;left:0;right:0;height:200%;display:grid;place-items:center}
.e-flap .top{top:0;border-radius:.06em .06em 0 0}
.e-flap .top span{top:0}
.e-flap .bot{bottom:0;border-radius:0 0 .06em .06em;background:color-mix(in srgb,var(--fg) 93%,#000)}
.e-flap .bot span{bottom:0}
.e-flap .ft{transform-origin:50% 100%;z-index:3}
.e-flap .fb{transform-origin:50% 0;z-index:3}
.e-flap .tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:.018em;min-height:1px;transform:translateY(-50%);background:color-mix(in srgb,var(--ac) 60%,transparent);z-index:5}

/* Flip Cards */
.e-cards{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:calc(var(--cw) * .1)}
.e-cards .card{width:var(--cw);height:calc(var(--cw) * 1.33);perspective:calc(var(--cw) * 3.3)}
.e-cards .in{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.e-cards b{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw) * .8);border-radius:.08em;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.e-cards .f{background:var(--fg);color:var(--ac)}
.e-cards .b{background:var(--ac);color:var(--fg);transform:rotateY(180deg)}
@keyframes mg-cardflip{0%,18%{transform:rotateY(0)}38%,68%{transform:rotateY(180deg)}88%,100%{transform:rotateY(360deg)}}

/* Typewriter */
.e-type{position:absolute;left:9%;right:6%;top:50%;transform:translateY(-50%);font-weight:700;line-height:1.5;color:var(--fg)}
.e-type div{min-height:1.5em;white-space:nowrap}
.e-type div+div{color:color-mix(in srgb,var(--fg) 55%,var(--bg))}
.e-type .cur{display:inline-block;width:.04em;min-width:2px;height:1em;background:var(--fg);vertical-align:-.14em;margin-left:.06em;animation:mg-blink 1s steps(1) infinite}
@keyframes mg-blink{50%{opacity:0}}

/* Slot Text */
.e-slot{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:calc(var(--tw) * .1)}
.e-slot .reel{position:relative;width:var(--tw);height:calc(var(--tw) * 1.33);overflow:hidden;background:var(--fg);border-radius:calc(var(--tw) * .07)}
.e-slot .reel::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),transparent 28%,transparent 72%,rgba(0,0,0,.45))}
.e-slot .strip b{display:grid;place-items:center;height:calc(var(--tw) * 1.33);font-size:calc(var(--tw) * .86);color:var(--ac)}

/* Odometer */
.e-odo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:.05em;color:var(--fg)}
.e-odo .lab{font-size:.46em;margin:0 .1em;white-space:nowrap}
.e-odo .dg{width:.62em;height:1em;overflow:hidden;background:var(--ac);border-radius:.06em}
.e-odo .dg b{display:grid;place-items:center;height:1.25em;font-size:.8em;font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-weight:800}
.e-odo .comma{font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:.6em;transform:translateY(.25em)}

/* Headline Swap */
.e-head{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;height:calc(var(--hf) * 2.1)}
.e-head .tag{background:#fff;color:var(--fg);font-size:calc(var(--hf) * .95);display:grid;place-items:center;padding:0 .4em;white-space:nowrap}
.e-head .bar{flex:1;position:relative;overflow:hidden;background:var(--fg)}
.e-head .bar b{position:absolute;inset:0;display:flex;align-items:center;padding-left:.32em;font-size:var(--hf);color:var(--ac);white-space:nowrap}

/* Split Halves */
.e-split{position:absolute;inset:0}
.e-split .lay{position:absolute;inset:0;display:grid;place-items:center;white-space:nowrap}
.e-split .top{clip-path:inset(0 0 50% 0)}
.e-split .bot{clip-path:inset(50% 0 0 0)}
.e-split .seam{position:absolute;left:0;right:0;top:50%;height:max(2px,.7cqh);transform-origin:50% 50%;margin-top:max(-1px,-.35cqh);background:#fff;opacity:0}

/* Outline Text */
.e-out{position:absolute;inset:-28% -15%;display:flex;flex-direction:column;justify-content:center;gap:.09em;transform:rotate(-8deg)}
.e-out .row{color:transparent;-webkit-text-stroke:.018em var(--fg);animation:mg-ofill 4s ease-in-out infinite both}
@keyframes mg-ofill{0%,8%{color:transparent}20%,58%{color:var(--ac)}72%,100%{color:transparent}}

/* Glitch Slices */
.e-glitch .lay{position:absolute;inset:0;display:grid;place-items:center}
.e-glitch b{color:var(--fg);white-space:nowrap}

/* Text Mask Pattern */
.e-mask b{white-space:nowrap;color:transparent;-webkit-text-stroke:.006em var(--fg);background-image:linear-gradient(45deg,var(--fg) 25%,var(--ac) 25% 50%,var(--fg) 50% 75%,var(--ac) 75%);background-size:8cqmin 8cqmin;-webkit-background-clip:text;background-clip:text;animation:mg-stripe .9s linear infinite}
@keyframes mg-stripe{to{background-position:8cqmin 0}}

/* Liquid Fill */
.e-liq b{white-space:nowrap}
.e-liq .o{color:transparent;-webkit-text-stroke:.007em var(--fg)}
.e-liq .f{color:transparent;background-repeat:repeat-x;-webkit-background-clip:text;background-clip:text}

/* Highlight Text */
.e-hl .panel{background:#fff;border-radius:.09em;padding:.45em .5em}
.e-hl .txt{position:relative;display:inline-block;isolation:isolate;color:var(--fg);white-space:nowrap}
.e-hl .mk{position:absolute;left:-.12em;right:-.12em;bottom:-.03em;height:52%;z-index:-1;background:var(--ac);border-radius:.04em;transform-origin:0 50%;animation:mg-hl 3.2s cubic-bezier(.6,0,.2,1) infinite both}
@keyframes mg-hl{0%,10%{transform:scaleX(0) skewX(-10deg);opacity:1}40%,80%{transform:scaleX(1) skewX(-10deg);opacity:1}92%,100%{transform:scaleX(1) skewX(-10deg);opacity:0}}

/* Split Invert */
.e-inv .lay{position:absolute;inset:0;display:grid;place-items:center;white-space:nowrap}
.e-inv .a{background:var(--bg);color:var(--fg)}
.e-inv .b{background:var(--fg);color:var(--bg)}

/* Text Echo */
.e-echo b{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.e-echo b.g{filter:blur(.012em)}

</style>
<style>
:root{
  --bg:#ECEEF2;--panel:#FFFFFF;--fg:#171B26;--muted:#5D6474;--line:#D3D8E0;--well:#D5DAE2;--sel:#2D5BFF;--selbg:#E6ECFF;--navbg:rgba(236,238,242,.92);
  --sans:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --latin:"Archivo","Helvetica Neue",Arial,sans-serif;
  --barh:58px;color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#10131A;--panel:#171B23;--fg:#E8EAF0;--muted:#9AA1B0;--line:#2A303C;--well:#0A0C10;--sel:#7C9BFF;--selbg:#1E2638;--navbg:rgba(16,19,26,.92);color-scheme:dark;}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--sel);outline-offset:2px;border-radius:4px}
select,input[type=text],input[type=number],input[type=search],textarea{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
select{cursor:pointer}
textarea{resize:vertical;line-height:1.6}
select:hover,input[type=text]:hover,input[type=number]:hover,input[type=search]:hover,textarea:hover{border-color:color-mix(in srgb,var(--fg) 35%,var(--line))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--line);background:var(--panel);font-weight:700;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn svg{width:12px;height:12px;fill:currentColor;flex:none}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.wide{width:100%}
.btn.sm{font-size:13px;padding:5px 12px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- shared bar ---------- */
.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;min-height:58px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap;font-size:17px;font-weight:900}
.brand span{font-family:var(--latin);font-stretch:85%;font-weight:600;font-size:14px;color:var(--muted)}
.views{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--fg) 7%,transparent)}
.views button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:800;cursor:pointer;white-space:nowrap;color:var(--muted)}
.views button:hover{color:var(--fg)}
.views button[aria-current=page]{background:var(--panel);color:var(--fg);box-shadow:0 1px 3px rgba(10,14,24,.12)}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.fld-inline{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;white-space:nowrap}
.fld-inline select{width:auto}
.menu{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:60;min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(10,14,24,.18)}
.pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.pop button:hover{background:var(--selbg)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.pop small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}html{scroll-behavior:auto}}

/* ---------- overview ---------- */
.c-wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.c-hero{padding:clamp(40px,7vw,84px) 0 clamp(26px,4vw,40px)}
.c-hero h1{margin:0;font-weight:900;font-size:clamp(46px,9vw,116px);line-height:1;letter-spacing:-.01em;display:flex;flex-wrap:wrap;align-items:center;gap:.14em}
.roll{display:inline-flex;font-family:var(--latin);font-stretch:75%;font-weight:800;background:var(--fg);color:var(--bg);padding:.02em .1em;border-radius:.08em;line-height:1;font-variant-numeric:tabular-nums}
.roll .d{display:block;height:1em;overflow:hidden}
.roll .d>span{display:block;transition:transform 1.5s cubic-bezier(.16,.84,.2,1)}
.roll .d:last-child>span{transition-duration:2s}
.roll .d i{display:block;height:1em;font-style:normal;text-align:center}
.c-lede{max-width:34em;margin:24px 0 0;font-size:clamp(16px,1.7vw,19px);line-height:1.8;color:var(--muted)}
.c-lede b{color:var(--fg)}
.c-try{margin-top:26px;max-width:620px}
.c-try label{display:block;font-weight:800;font-size:15px;margin-bottom:8px}
.c-try .row{display:flex;gap:8px}
.c-try input{font-size:17px;padding:11px 14px;border-radius:10px}
.c-try small{display:block;color:var(--muted);margin-top:8px;font-size:13px;line-height:1.6}
.c-nav{position:sticky;top:var(--barh);z-index:30;background:var(--navbg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.c-nav .c-wrap{display:flex;align-items:center;gap:4px;height:52px}
#c-nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
#c-nav::-webkit-scrollbar{display:none}
#c-nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:700;font-size:15px;padding:7px 13px;border-radius:999px;white-space:nowrap}
#c-nav a small{font-family:var(--latin);font-weight:600;font-size:13px;margin-left:6px;opacity:.8}
#c-nav a:hover{color:var(--fg)}
#c-nav a.on{background:var(--fg);color:var(--bg)}
.c-sec{padding-top:clamp(40px,6vw,72px);scroll-margin-top:calc(var(--barh) + 52px)}
.c-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.c-head h2{margin:0;font-size:clamp(32px,4.4vw,46px);font-weight:900;line-height:1.1}
.c-head .en{font-family:var(--latin);font-stretch:85%;font-weight:600;font-size:clamp(18px,2vw,22px);color:var(--muted)}
.c-head .range{margin-left:auto;font-family:var(--latin);font-stretch:75%;font-weight:700;font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.c-head p{flex-basis:100%;margin:4px 0 0;color:var(--muted);font-size:16px;line-height:1.6}
.c-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 28px}
@media (max-width:780px){.c-grid{grid-template-columns:1fr;gap:34px}}
.c-card{scroll-margin-top:calc(var(--barh) + 70px)}
.c-stage{position:relative;aspect-ratio:16/7;border-radius:4px;overflow:hidden;background:var(--well)}
.c-stage::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 10%,transparent);pointer-events:none;z-index:2}
.c-card.flash .c-stage{animation:c-flash 1.6s ease-out}
@keyframes c-flash{0%,40%{box-shadow:0 0 0 4px var(--sel)}100%{box-shadow:0 0 0 4px transparent}}
@media (prefers-reduced-motion: reduce){.c-card.flash .c-stage{animation:none;box-shadow:0 0 0 4px var(--sel)}}
.c-meta{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:baseline;margin-top:14px}
.c-meta .no{font-family:var(--latin);font-stretch:75%;font-weight:700;font-size:22px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.4em}
.c-meta .nm{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:10px;row-gap:2px;min-width:0}
.c-meta h3{margin:0;font-size:21px;font-weight:900;line-height:1.3}
.c-meta .nm .en{font-family:var(--latin);font-weight:600;font-size:16px;opacity:.75}
.c-meta .desc{grid-column:2;margin:6px 0 0;color:var(--muted);font-size:15px;line-height:1.65}
.c-meta .use{white-space:nowrap}
.c-meta .acts{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.c-foot{padding:72px 0 56px;color:var(--muted);font-size:14px;line-height:1.7}


/* collection switch */
.c-cols{display:inline-flex;gap:8px;margin-bottom:clamp(22px,3vw,34px);flex-wrap:wrap}
.c-cols button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:10px 16px;cursor:pointer;font-weight:900;font-size:16px;text-align:left}
.c-cols button small{font-weight:500;font-size:12.5px;color:var(--muted)}
.c-cols button:hover{border-color:var(--fg)}
.c-cols button[aria-pressed=true]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.c-cols button[aria-pressed=true] small{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.c-colmini{display:inline-flex;flex:none;padding:3px;gap:2px;border-radius:999px;border:1px solid var(--line);margin-right:8px}
.c-colmini button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-weight:800;font-size:13px;cursor:pointer;color:var(--muted)}
.c-colmini button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
#c-nav a[hidden]{display:none}

/* formal theme for the overview */
#view-catalog[data-col=formal]{--bg:#F4F6F9;--fg:#14213D;--muted:#5B6577;--line:#D8DEE8;--well:#E6EBF2;--sel:#1F5FBF;--selbg:#E3ECFA;--navbg:rgba(244,246,249,.94)}
@media (prefers-color-scheme: dark){#view-catalog[data-col=formal]{--bg:#0D1626;--fg:#E6ECF5;--muted:#93A0B5;--line:#24324A;--well:#08101C;--sel:#6EA1F0;--selbg:#16243A;--navbg:rgba(13,22,38,.94)}}
#view-catalog[data-col=formal] .c-hero{border-top:6px solid var(--sel)}
#view-catalog[data-col=formal] .c-head h2{font-weight:700}
#view-catalog[data-col=formal] .roll{background:var(--sel);color:#fff}
#view-catalog[data-col=formal] .c-cols button[aria-pressed=true],#view-catalog[data-col=formal] .c-colmini button[aria-pressed=true],#view-catalog[data-col=formal] #c-nav a.on{background:var(--sel);border-color:var(--sel);color:#fff}
.row2 select{width:auto;min-width:9em}

/* luxe theme for the overview */
#view-catalog{background:var(--bg);color:var(--fg)}
#view-catalog[data-col=luxe]{--bg:#F5F1EA;--fg:#2B2420;--muted:#7A6E64;--line:#E2D8C9;--well:#ECE5DA;--sel:#A8874E;--selbg:#EFE6D6;--navbg:rgba(245,241,234,.92)}
@media (prefers-color-scheme: dark){#view-catalog[data-col=luxe]{--bg:#17140F;--fg:#EFE8DD;--muted:#A99D8F;--line:#30291F;--well:#0F0D0A;--sel:#CDB07A;--selbg:#2A2318;--navbg:rgba(23,20,15,.92)}}
#view-catalog[data-col=luxe] .c-hero h1,#view-catalog[data-col=luxe] .c-head h2{font-family:"Cormorant Garamond","Noto Serif TC","Songti TC",serif;font-weight:300;letter-spacing:.02em}
#view-catalog[data-col=luxe] .c-meta h3{font-family:"Noto Serif TC","Songti TC",serif;font-weight:500}
#view-catalog[data-col=luxe] .c-head .en,#view-catalog[data-col=luxe] .c-meta .nm .en{font-family:"Cormorant Garamond",serif;font-style:italic;font-stretch:100%;font-weight:400}
#view-catalog[data-col=luxe] .roll{background:transparent;color:var(--sel);box-shadow:inset 0 0 0 1px currentColor;font-family:"Cormorant Garamond",serif;font-stretch:100%;font-weight:300}
#view-catalog[data-col=luxe] .c-stage{border-radius:2px}
#view-catalog[data-col=luxe] .btn{border-color:var(--line);background:transparent}
#view-catalog[data-col=luxe] .btn:hover{border-color:var(--sel)}
#view-catalog[data-col=luxe] .c-cols button[aria-pressed=true],#view-catalog[data-col=luxe] .c-colmini button[aria-pressed=true],#view-catalog[data-col=luxe] #c-nav a.on{background:var(--sel);border-color:var(--sel);color:#fff}

/* ---------- mix edition ---------- */
.pal-h{font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 6px}
.colbadge{display:inline-block;font-style:normal;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:999px;margin-right:8px;vertical-align:1px;background:var(--fg);color:var(--bg)}
.colbadge.luxe{background:#A8874E;color:#fff}
.colbadge.formal{background:#1F5FBF;color:#fff}
.grp-note{margin:-2px 0 10px;color:var(--muted);font-size:13px;line-height:1.6}
.unify{display:flex;flex-wrap:wrap;gap:6px}
.unify .btn{font-size:13px;padding:6px 11px}

/* ---------- video dialog ---------- */
.dlg{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--panel);color:var(--fg);width:min(560px,calc(100vw - 32px));box-shadow:0 24px 60px rgba(10,14,24,.3)}
.dlg::backdrop{background:rgba(10,12,18,.55)}
.dlg-in{padding:22px 22px 18px}
.dlg h2{margin:0;font-size:20px;font-weight:900}
.dlg-sub{margin:6px 0 16px;color:var(--muted);line-height:1.65;font-size:13.5px}
.dlg-opts .row2{margin-bottom:12px}
.dlg-opts .seg2 button:disabled{opacity:.5;cursor:not-allowed}
.dlg-info{margin:4px 0 0;font-family:var(--latin);font-weight:700;font-variant-numeric:tabular-nums}
.dlg-note{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
.dlg-note:empty{display:none}
.dlg-prog{margin-top:16px}
.dlg-prog .track{height:8px;border-radius:99px;background:color-mix(in srgb,var(--fg) 10%,transparent);overflow:hidden}
.dlg-prog i{display:block;height:100%;width:0;background:var(--sel);border-radius:inherit}
.dlg-prog span{display:block;margin-top:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dlg video{display:block;width:100%;max-height:44vh;margin-top:14px;border-radius:8px;background:#000}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dlg-acts a.btn{text-decoration:none}

/* ---------- studio ---------- */
#view-studio{display:grid;grid-template-columns:268px minmax(0,1fr) 348px;height:calc(100vh - var(--barh));height:calc(100dvh - var(--barh))}
/* scenes */
.scenes{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 12px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px}
.sec-h h2{margin:0;font-size:15px;font-weight:900}
.sec-h span{color:var(--muted);font-family:var(--latin);font-weight:600;font-variant-numeric:tabular-nums}
#sceneList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.scn{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1.5px solid transparent;background:transparent;border-radius:10px;padding:7px;cursor:pointer}
.scn:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.scn.on{border-color:var(--sel);background:var(--selbg)}
.scn.live .sw{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--sel)}
.sw{width:40px;height:40px;border-radius:7px;display:grid;place-items:center;font-weight:900;font-size:17px;border-bottom:4px solid}
.scn-t{min-width:0;display:flex;flex-direction:column;gap:1px}
.scn-t b{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scn-t small{font-family:var(--latin);color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scn-t em{font-style:normal;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scn-d{font-family:var(--latin);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.scene-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.scene-actions .btn{padding:6px 4px;font-size:13px}

/* stage */
.stagearea{display:flex;flex-direction:column;gap:12px;padding:18px;min-width:0;min-height:0}
#host{flex:1;min-height:0;background:var(--well);border-radius:8px}
#host:fullscreen{background:#000;border-radius:0}
.tl{-webkit-user-select:none;user-select:none;position:relative;height:46px;border-radius:8px;background:var(--panel);border:1px solid var(--line);overflow:hidden;cursor:pointer;touch-action:none;flex:none}
.segs{position:absolute;inset:0;display:flex}
.seg{position:relative;min-width:0;border-right:1px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
.seg:last-child{border-right:0}
.seg i{position:absolute;left:0;right:0;top:0;height:4px}
.seg b{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg small{font-family:var(--latin);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg.on{background:var(--selbg)}
.ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--fg);pointer-events:none}
.ph::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--fg)}
.tlmeta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;flex:none}
.tlmeta span:last-child{font-family:var(--latin);font-weight:600;font-variant-numeric:tabular-nums}

/* inspector */
.insp{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:6px 16px 24px;min-height:0}
.grp{padding:14px 0;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.grp h3{margin:0 0 10px;font-size:13px;font-weight:900;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.fld:last-child{margin-bottom:0}
.fld>span{font-weight:700;font-size:13px}
.fxnav{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px;margin-top:8px}
.fxnav .btn{padding:6px 6px;font-size:13px}
.fxdesc{margin:10px 0 0;color:var(--muted);line-height:1.65;font-size:13px}
.fxdesc span{font-family:var(--latin);font-weight:700;color:var(--fg)}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.pal button{height:34px;border-radius:8px;border:1.5px solid var(--line);cursor:pointer;display:grid;place-items:center;font-weight:900;font-size:15px;padding:0;position:relative;overflow:hidden}
.pal button i{position:absolute;left:0;right:0;bottom:0;height:5px}
.pal button:hover{border-color:var(--fg)}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.colors label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700}
.colors input[type=color]{width:100%;height:34px;border:1.5px solid var(--line);border-radius:8px;padding:2px;background:var(--panel);cursor:pointer}
.colors code{font-family:var(--latin);font-size:12px;color:var(--muted);font-weight:600}
.link{border:0;background:none;padding:0;margin-top:10px;color:var(--sel);font-weight:700;cursor:pointer;font-size:13px}
.rng{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-bottom:10px}
.rng span{font-weight:700;font-size:13px;min-width:3em}
.rng output{font-family:var(--latin);font-weight:700;font-variant-numeric:tabular-nums;min-width:3.6em;text-align:right;font-size:13px}
.rng input{width:100%;accent-color:var(--sel)}
.seg2{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.seg2 button{border:0;background:transparent;padding:5px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px}
.seg2 button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.row2>span{font-weight:700;font-size:13px}


@media (max-width:1080px){
  .bar{flex-wrap:wrap;padding:10px 14px;gap:10px}
  .tools{margin-left:0;flex-wrap:wrap;width:100%}
  #view-studio{display:flex;flex-direction:column;height:auto;min-height:calc(100vh - var(--barh))}
  .stagearea{order:1;padding:12px;position:sticky;top:var(--barh);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
  #host{flex:none;height:min(58vw,46vh)}
  .scenes{order:2;border-right:0;border-bottom:1px solid var(--line)}
  #sceneList{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  #sceneList li{flex:0 0 220px}
  .insp{order:3;border-left:0}
}
@media (max-width:640px){
  .brand span{display:none}
  .bar{position:relative}
  .c-nav{top:0}

  #host{height:min(56.25vw,34vh)}
  .tl{height:38px}
  .seg small{display:none}
  .tlmeta{font-size:12px}
  .c-sec{scroll-margin-top:52px}
  .c-card{scroll-margin-top:70px}
}

</style>
</head>
<body data-view="studio">
<header class="bar" id="bar">
  <div class="brand">文字動態混搭<span lang="en">Mix Studio</span></div>
  <nav class="views" aria-label="切換頁面">
    <button type="button" data-view="studio" aria-current="page">工作台</button>
    <button type="button" data-view="catalog" aria-current="false">特效總覽</button>
  </nav>
  <div class="tools" data-for="catalog">
    <button class="btn" id="c-toggle" type="button"></button>
  </div>
  <div class="tools" data-for="studio" hidden>
    <label class="fld-inline"><span>比例</span><select id="aspect"></select></label>
    <button class="btn" id="btnPlay" type="button"></button>
    <button class="btn" id="btnAll" type="button">從頭播放全部</button>
    <button class="btn" id="btnFull" type="button">全螢幕</button>
    <button class="btn" id="btnVideo" type="button">輸出影片</button>
    <div class="menu">
      <button class="btn primary" id="btnExport" type="button" aria-haspopup="true" aria-expanded="false">匯出</button>
      <div class="pop" id="exportMenu" hidden>
        <button type="button" data-act="html">下載網頁（.html）<small>單一檔案，打開就自動播放</small></button>
        <button type="button" data-act="copyhtml">複製網頁原始碼<small>下載被擋時用這個</small></button>
        <button type="button" data-act="prompts">複製全部場景的提示詞</button>
        <hr>
        <button type="button" data-act="json">下載設定檔（.json）</button>
        <button type="button" data-act="import">匯入設定檔或匯出的網頁…</button>
        <hr>
        <button type="button" data-act="reset">換回範例內容</button>
      </div>
    </div>
  </div>
</header>

<main id="view-catalog">
  <header class="c-hero">
    <div class="c-wrap">
      <div class="c-cols" role="group" aria-label="選擇系列">
        <button type="button" data-col-pick="classic" aria-pressed="true">經典 40 招<small>衝擊有力・色塊鮮明</small></button>
        <button type="button" data-col-pick="luxe" aria-pressed="false">精品 40 招<small>高雅淺色・緩慢細緻</small></button>
        <button type="button" data-col-pick="formal" aria-pressed="false">研討會 40 招<small>正式清晰・資訊層次</small></button>
      </div>
      <h1 aria-label="文字動態 40 招"><span aria-hidden="true">文字動態</span><span class="roll" aria-hidden="true"><span class="d" data-to="4" data-loop="1"><span></span></span><span class="d" data-to="0" data-loop="2"><span></span></span></span><span aria-hidden="true">招</span></h1>
      <p class="c-lede" id="c-lede"></p>
      <div class="c-try">
        <label for="c-words">換成你的字，40 招一起預覽</label>
        <div class="row"><input id="c-words" type="search" maxlength="60" placeholder="例如：新品發表｜今晚八點" autocomplete="off"><button class="btn" id="c-clear" type="button">清除</button></div>
        <small>多個詞用「|」隔開。需要好幾個詞的招式（翻牌、拉霸、跑馬燈…）會依序使用；空白時顯示各招的範例字。複製的提示詞也會帶上你的字。</small>
      </div>
    </div>
  </header>
  <nav class="c-nav" aria-label="分類"><div class="c-wrap"><div class="c-colmini" role="group" aria-label="系列"><button type="button" data-col-pick="classic" aria-pressed="true">經典</button><button type="button" data-col-pick="luxe" aria-pressed="false">精品</button><button type="button" data-col-pick="formal" aria-pressed="false">研討會</button></div><div id="c-nav"></div></div></nav>
  <div id="c-main"></div>
  <footer class="c-foot"><div class="c-wrap">卡片只在捲到畫面上時才播放；系統開啟「減少動態效果」時預設為暫停。總覽和工作台用的是同一套動畫，工作台匯出的網頁也一樣。</div></footer>
</main>

<main id="view-studio" hidden>
  <section class="scenes" aria-label="場景">

      <button class="btn" id="actDup" type="button">複製</button>
      <button class="btn" id="actDel" type="button">刪除</button>

  </section>
  <section class="stagearea" aria-label="預覽">
    <div id="host"></div>
    <div class="tl" id="tl" aria-label="時間軸，點擊或拖曳跳到該時間"><div class="segs" id="segs"></div><div class="ph" id="ph"></div></div>

  </section>
  <section class="insp" id="insp" aria-label="這一幕的設定"></section>
</main>

    <div class="dlg-opts">

<script id="mg-lib-js">
/* ===== Motion engine: shared by the studio and exported pages ===== */
const MG_SANS='"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif';
const MG_SERIF='"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif';
const $el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const EZ={out:p=>1-Math.pow(1-p,3),in:p=>p*p*p,io:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
function keys(p,ks){
  if(p<=ks[0][0])return ks[0][1];
  for(let i=1;i<ks.length;i++){if(p<=ks[i][0]){const[t0,v0]=ks[i-1],[t1,v1]=ks[i];const q=EZ.io((p-t0)/(t1-t0));return Array.isArray(v0)?v0.map((a,j)=>a+(v1[j]-a)*q):v0+(v1-v0)*q;}}
  return ks[ks.length-1][1];
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tlen=s=>{let n=0;for(const c of String(s))n+=c===' '?.32:/[\x00-\xff]/.test(c)?.6:1;return Math.max(n,.6);};
const isLatin=s=>/^[\x00-\xff]*$/.test(String(s));
const longest=a=>a.reduce((m,s)=>tlen(s)>tlen(m)?s:m,'');
const fsz=(h,s,w=86)=>`min(calc(${h}cqh * var(--k)),${(w/tlen(s)).toFixed(2)}cqw)`;
const mqh=(text,reps)=>{const u=esc(text).repeat(reps);return `<span>${u}</span><span aria-hidden="true">${u}</span>`;};
const repsFor=(inst,unit,fontCqh,span=1.3)=>Math.max(2,Math.ceil((100*(inst.w/inst.h)*span)/(tlen(unit)*fontCqh))+1);
const pc=x=>(x*100).toFixed(2)+'%';
let MG_UID=0;const uid=()=>'mg'+(++MG_UID)+Math.random().toString(36).slice(2,6);
function fit(cv,inst){const dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(1,Math.round(inst.w*dpr)),h=Math.max(1,Math.round(inst.h*dpr));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const setT=(el,s)=>{if(el.textContent!==s)el.textContent=s;};
const rgba=(hex,a)=>{let h=String(hex||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};
const MG_ELEGANT='"Cormorant Garamond","Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif';
const FONT_META={sans:{stack:MG_SANS,w:900,fams:['Noto Sans TC'],css:'var(--sans)'},serif:{stack:MG_SERIF,w:900,fams:['Noto Serif TC'],css:'var(--serif)'},
  elegant:{stack:MG_ELEGANT,w:300,fams:['Cormorant Garamond','Noto Serif TC'],css:'var(--elegant)'},thin:{stack:MG_SANS,w:300,fams:['Noto Sans TC'],css:'var(--thin)'}};
const fontMeta=f=>FONT_META[f]||FONT_META.sans;
const loadFont=(P,text,w)=>{if(!(document.fonts&&document.fonts.load))return Promise.resolve();const m=fontMeta(P.font);return Promise.all(m.fams.map(f=>document.fonts.load(`${w||m.w} 20px "${f}"`,text).catch(()=>{})));};
const canvasFont=(P,px,w)=>{const m=fontMeta(P.font);return `${w||m.w} ${px}px ${m.stack}`;};
const unitOf=t=>String(t).trim()+(isLatin(t)?' • ':'・');
const chars=s=>[...String(s).replace(/\s+/g,'')];
function padTo(arr,n,latin){return arr.map(w=>{const c=[...w];while(c.length<n)c.push(latin?' ':'\u3000');return c;});}
function vcolHTML(text,size,dur,rev,color){
  const reps=Math.max(2,Math.ceil(150/(size*1.08*Math.max(1,[...text].length))));const u=esc(text).repeat(reps);
  return `<div class="vcol" style="font-size:${size.toFixed(2)}cqh;color:${color}"><div class="vmq${rev?' rev':''}" style="--d:${dur}s"><span>${u}</span><span aria-hidden="true">${u}</span></div></div>`;
}

const INK='#171B26',YEL='#FFD60A',COB='#2D5BFF',RED='#FF4B3E',WHT='#FFFFFF',CRM='#F4F3EE';
const C=(bg,fg,ac)=>({bg,fg,ac});
const F={
  text:(label='文字')=>({k:'text',label}),
  text2:(label)=>({k:'text2',label}),
  list:(label='詞（一行一個）',max=6)=>({k:'list',label,max}),
  num:(label='數字')=>({k:'num',label})
};

const MG_CATS=[
  {id:'impact',zh:'衝擊',en:'Impact'},{id:'flow',zh:'流動',en:'Flow'},{id:'depth',zh:'縱深',en:'Depth'},
  {id:'switch',zh:'切換',en:'Switch'},{id:'style',zh:'風格',en:'Style'}];

const MG_FX=[
/* ================= IMPACT ================= */
{id:'burst',cat:'impact',zh:'文字爆開',en:'Word Burst',fields:[F.text()],d:{text:'衝擊',...C(INK,YEL,WHT)},dur:2.2,
 how:'字從很小快速放大、稍微超過原尺寸後回彈定住，同時從字的中心向外噴出一圈細長碎片，停一下後淡出再重來。',
 build(st,inst,P){let s='';for(let i=0;i<14;i++){const a=i*360/14+(i%2?8:-6),d=40+(i%3)*10;s+=`<i style="--a:${a}deg;--d:${d}cqmin"></i>`;}
  st.append($el('div','fill e-burst',s+`<b style="font-size:${fsz(44,P.text,84)}">${esc(P.text)}</b>`));}},

{id:'seq',cat:'impact',zh:'逐字敲擊',en:'Letter Sequence',fields:[F.text('文字（逐字出現；有空格時以詞為單位）')],d:{text:'一起衝刺吧',...C(YEL,INK,INK)},dur:P=>Math.max(1.2,(String(P.text).trim().includes(' ')?String(P.text).trim().split(/\s+/).length:chars(P.text).length)*.42),
 how:'畫面中央一次只顯示一個大字，每個字從放大且模糊的狀態快速縮回原尺寸、帶一點回彈，跟著節拍一個接一個替換。',
 build(st,inst,P){const c=$el('div','fill e-js');st.append(c);const raw=String(P.text).trim();const tk=raw.includes(' ')?raw.split(/\s+/):chars(raw);if(!tk.length)tk.push(' ');
  const b=$el('b');b.style.fontSize=fsz(64,longest(tk),86);c.append(b);const D=.42;let last=-1;
  return t=>{const i=Math.floor(t/D)%tk.length;if(i!==last){last=i;b.textContent=tk[i];}const p=clamp((t%D)/.4);
   const s=keys(p,[[0,2.3],[.45,.93],[.7,1.03],[1,1]]),bl=Math.max(0,1-p/.45)*1.5;
   b.style.transform=`scale(${s.toFixed(3)})`;b.style.opacity=clamp(p/.3).toFixed(3);b.style.filter=bl>.01?`blur(${(bl*inst.h/100).toFixed(1)}px)`:'none';};}},

{id:'stamp',cat:'impact',zh:'印章',en:'Text Stamp',fields:[F.list('章上的字（一行一個，最多 6 個）',6)],d:{list:['核准','完成','定案'],...C(WHT,RED,RED)},dur:P=>2.6+.35*P.list.length,
 how:'幾個帶外框的字章，各自歪一點角度，從放大透明的狀態用力壓到畫面上、稍微回彈，依序蓋在不同位置，最後一起淡出。',
 build(st,inst,P){const L=P.list.slice(0,6),n=L.length,id=uid(),ar=inst.w/inst.h,D=2.6+.35*n,step=Math.min(.16,.5/n);let css='',h='';
  L.forEach((w,i)=>{const r=[-9,5,-5,7,-6,4][i%6];let x,y;
   if(ar>=1){x=(i+.5)/n*100;y=n===1?50:(i%2?62:40);}else{y=(i+.5)/n*100;x=n===1?50:(i%2?60:40);}
   const a=.04+i*step,b=a+.08,T=`translate(-50%,-50%) rotate(${r}deg)`;
   css+=`@keyframes ${id}_${i}{0%,${pc(a)}{opacity:0;transform:${T} scale(2.4)}${pc(b)},84%{opacity:1;transform:${T} scale(1)}92%,100%{opacity:0;transform:${T} scale(1)}}`;
   const fs=ar>=1?fsz(15,w,74/n):`min(calc(${(60/n).toFixed(1)}cqh * var(--k)),${(62/tlen(w)).toFixed(1)}cqw)`;
   h+=`<b style="left:${x}%;top:${y}%;font-size:${fs};animation-name:${id}_${i};animation-duration:${D}s">${esc(w)}</b>`;});
  st.append($el('style','',css));st.append($el('div','e-stamp',h));}},

{id:'punch',cat:'impact',zh:'衝擊放大',en:'Punch Zoom',fields:[F.text()],d:{text:'突破',...C(INK,WHT,RED)},dur:2.4,
 how:'字從畫面深處的極小尺寸高速衝到前景、略為超出後定住，衝出的過程後面拖著幾層半透明的彩色殘影，結尾放大淡出。',
 build(st,inst,P){const t=esc(P.text);let g='';for(let i=5;i>=1;i--)g+=`<b class="g" style="animation-delay:${(i*.035).toFixed(3)}s;color:color-mix(in srgb,var(--ac) ${62-i*9}%,transparent)">${t}</b>`;
  const c=$el('div','fill e-punch',g+`<b>${t}</b>`);c.style.fontSize=fsz(44,P.text,84);st.append(c);}},

{id:'stack',cat:'impact',zh:'動態堆疊',en:'Kinetic Stack',fields:[F.list('每行一句（最多 5 行）',5)],d:{list:['穿過','人海','現在出發'],...C(COB,WHT,YEL)},dur:P=>2.6+.3*P.list.length,
 how:'幾行字依序從左、右、下方飛進來，在中央對齊疊成一組，第二行換強調色；停一下後整組一起往上飛出。',
 build(st,inst,P){const L=P.list.slice(0,5),n=L.length,id=uid(),D=2.6+.3*n,step=Math.min(.13,.42/n),base=70/n;let css='',h='';
  L.forEach((ln,i)=>{const a=i*step,b=a+.1,from=['translateX(-140cqw)','translateX(140cqw)','translateY(60cqh) scale(.7)'][i%3],em=i===1&&n>1?1.25:1;
   css+=`@keyframes ${id}_${i}{0%${a>0?','+pc(a):''}{transform:${from};opacity:0}${pc(b)},80%{transform:none;opacity:1}92%,100%{transform:translateY(-80cqh);opacity:0}}`;
   h+=`<b style="font-size:${fsz(base*em*.86,ln,84)};color:${i===1&&n>1?'var(--ac)':'var(--fg)'};animation-name:${id}_${i};animation-duration:${D}s">${esc(ln)}</b>`;});
  st.append($el('style','',css));st.append($el('div','fill e-stack',`<div class="col">${h}</div>`));}},

{id:'stretch',cat:'impact',zh:'伸縮字',en:'Stretch Text',fields:[F.text()],d:{text:'拉長了',...C(YEL,INK,INK)},dur:3.6,
 how:'每個字以底部為基準往上拉長、同時變窄，再壓扁回彈到原狀，字與字之間錯開時間，形成一波一波的彈性律動。',
 build(st,inst,P){const c=$el('div','fill e-stretch',`<div style="font-size:${fsz(46,P.text,84)}">${[...String(P.text)].map((ch,i)=>`<b style="animation-delay:${(i*.14).toFixed(2)}s">${ch===' '?'&nbsp;':esc(ch)}</b>`).join('')}</div>`);st.append(c);}},

{id:'zoom',cat:'impact',zh:'穿越放大',en:'Text Zoom Through',fields:[F.list('依序出現的詞（一行一個）',8)],d:{list:['未來','光速','次元'],...C(WHT,INK,RED)},dur:P=>1.5*P.list.length,
 how:'詞先從小淡入定住，接著急速放大到撐爆畫面並帶動態模糊，像鏡頭穿過字，穿過去之後換下一個詞重複。',
 build(st,inst,P){const c=$el('div','fill e-js');const b=$el('b');c.append(b);st.append(c);const W=P.list,cols=[P.fg,P.ac],D=1.5;let last=-1;b.style.fontSize=fsz(40,longest(W),80);
  return t=>{const i=Math.floor(t/D)%W.length,p=(t%D)/D;if(i!==last){last=i;b.textContent=W[i];b.style.color=cols[i%2];}
   let s,o,bl=0;if(p<.22){const q=EZ.out(p/.22);s=.55+.45*q;o=q;}else if(p<.62){s=1+.04*(p-.22)/.4;o=1;}else{const q=EZ.in((p-.62)/.38);s=1.04*Math.pow(14,q);o=1-q;bl=q*1.4;}
   b.style.transform=`scale(${s.toFixed(3)})`;b.style.opacity=o.toFixed(3);b.style.filter=bl?`blur(${(bl*inst.h/100).toFixed(1)}px)`:'none';};}},

{id:'squeeze',cat:'impact',zh:'擠壓彈跳',en:'Text Squeeze',fields:[F.list('輪流出現的詞（一行一個）',6)],d:{list:['彈力','反彈'],...C(INK,WHT,YEL)},dur:P=>1.7*P.list.length,
 how:'字像橡皮一樣先被壓扁成又寬又矮，在最扁的瞬間換成下一個詞，再拉高回彈、晃兩下後定住。',
 build(st,inst,P){const c=$el('div','fill e-js');const b=$el('b');b.style.transformOrigin='50% 88%';c.append(b);st.append(c);const W=P.list,cols=[P.ac,P.fg],D=1.7;let last=-1;b.style.fontSize=fsz(44,longest(W),82);
  const K=[[0,[1,1]],[.16,[1.42,.45]],[.3,[.82,1.22]],[.42,[1.08,.92]],[.52,[.98,1.03]],[.6,[1,1]],[1,[1,1]]];
  return t=>{const n=Math.floor(t/D),p=(t%D)/D,i=(n+(p>=.16?1:0))%W.length;if(i!==last){last=i;b.textContent=W[i];b.style.color=cols[i%2];}
   const[sx,sy]=keys(p,K);b.style.transform=`scale(${sx.toFixed(3)},${sy.toFixed(3)})`;};}},

/* ================= FLOW ================= */
{id:'huge',cat:'flow',zh:'巨字滑過',en:'Huge Text Scroll',fields:[F.text()],d:{text:'城市夜行',...C(INK,WHT,YEL)},dur:6,
 how:'一行大到被畫面裁切的超大字緩慢往左橫移，下方另一條小字帶以較快速度同方向跑，形成一快一慢的層次。',
 build(st,inst,P){const ar=inst.w/inst.h,u=unitOf(P.text),big=Math.min(86,90*ar)*P.k,sm=11*P.k,top=Math.max(-5,(85-big)/2-5);
  st.insertAdjacentHTML('beforeend',`<div class="e-huge"><div class="big" style="top:${top.toFixed(1)}cqh;font-size:${big.toFixed(1)}cqh"><div class="mq" style="--d:${(4.5*tlen(u)).toFixed(1)}s">${mqh(u,repsFor(inst,u,big,1.1))}</div></div><div class="strip" style="font-size:${sm.toFixed(1)}cqh"><div class="mq" style="--d:${(1.2*tlen(u)).toFixed(1)}s">${mqh(u,repsFor(inst,u,sm))}</div></div></div>`);}},

{id:'vert',cat:'flow',zh:'直書逆走',en:'Vertical Typography',fields:[F.text('大字欄'),F.text2('小字欄')],d:{text:'靜止',text2:'疾走',font:'serif',...C(YEL,INK,INK)},dur:6,
 how:'用直排明體排成好幾欄，大字欄與小字欄交錯，相鄰欄位往相反方向無限捲動。',
 build(st,inst,P){const W=100*inst.w/inst.h,b=24*P.k,s=b*.38,pairs=Math.max(1,Math.floor(W*.9/((b+s)*1.4)));let h='';const ub=unitOf(P.text),us=unitOf(P.text2);
  for(let i=0;i<pairs;i++){h+=vcolHTML(us,s,5+(i%3),false,'var(--ac)');h+=vcolHTML(ub,b,14+(i%3)*2,true,'var(--fg)');}h+=vcolHTML(us,s,6,false,'var(--ac)');
  st.insertAdjacentHTML('beforeend',`<div class="e-cols">${h}</div>`);}},

{id:'rep',cat:'flow',zh:'重複波浪',en:'Repeating Text',fields:[F.text()],d:{text:'回聲',...C(WHT,INK,COB)},dur:5.6,
 how:'同一個詞重複排滿整個畫面，平常是淡色，一道顏色波從對角方向依序掃過每個字，讓滿版文字像在呼吸。',
 build(st,inst,P){const f=12*P.k,W=100*inst.w/inst.h,rows=Math.max(4,Math.ceil(100/(f*1.35))),cols=Math.ceil((W+20)/(tlen(P.text)*f+f*.22))+1;let h='';
  for(let r=0;r<rows;r++){h+='<div>';for(let c=0;c<cols;c++)h+=`<span style="animation-delay:${(-((c*.09+r*.16)%2.8)).toFixed(2)}s">${esc(P.text)}</span>`;h+='</div>';}
  const box=$el('div','e-rep',h);box.style.fontSize=f.toFixed(2)+'cqh';st.append(box);}},

{id:'bands',cat:'flow',zh:'斜線帶',en:'Diagonal Text Bands',fields:[F.text()],d:{text:'日落之前',...C(COB,INK,YEL)},dur:6,
 how:'兩條傾斜角度不同的色帶橫跨畫面，帶上的文字無限循環，兩條帶子往相反方向跑。',
 build(st,inst,P){const f=14*P.k,u=unitOf(P.text),r=repsFor(inst,u,f,1.8),d=(2.2*tlen(u)).toFixed(1);
  st.insertAdjacentHTML('beforeend',`<div class="e-bands" style="font-size:${f.toFixed(1)}cqh"><div class="band b1" style="top:13%"><div class="mq" style="--d:${d}s">${mqh(u,r)}</div></div><div class="band b2" style="top:57%"><div class="mq rev" style="--d:${(d*1.2).toFixed(1)}s">${mqh(u,r)}</div></div></div>`);}},

{id:'ribbon',cat:'flow',zh:'緞帶',en:'Text Ribbon',fields:[F.text()],d:{text:'隨音樂擺動',...C(INK,INK,YEL)},dur:6,
 how:'一條 S 形彎曲緞帶橫越畫面，文字貼著緞帶的曲線排列並沿著路徑持續流動。',
 build(st,inst,P){const VW=350*Math.max(.4,inst.w/inst.h),X=x=>(x*VW/800).toFixed(1),id=uid(),u=unitOf(P.text),fs=34*P.k,sw=64*P.k;
  const L0=fs*tlen(u),n=Math.ceil(VW*2.2/L0)+2;
  st.insertAdjacentHTML('beforeend',`<svg class="fx-ribbon" style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 ${VW.toFixed(1)} 350" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
   <path d="M${X(-140)},305 C${X(60)},115 ${X(250)},125 ${X(420)},245 S${X(720)},365 ${X(940)},175" style="fill:none;stroke:${rgba('#ffffff',.13)};stroke-width:${(sw*.4).toFixed(1)}"/>
   <path id="${id}" d="M${X(-140)},250 C${X(60)},40 ${X(260)},40 ${X(420)},190 S${X(720)},320 ${X(940)},110" style="fill:none;stroke:${P.ac};stroke-width:${sw.toFixed(1)}"/>
   <text dominant-baseline="central" style='fill:${P.fg};font-family:${P.font==='serif'?MG_SERIF:MG_SANS};font-weight:900;font-size:${fs.toFixed(1)}px'><textPath href="#${id}">${esc(u).repeat(n)}</textPath></text></svg>`);
  const tp=st.querySelector('textPath'),tx=st.querySelector('svg text');let L=0;

{id:'marq',cat:'flow',zh:'跑馬燈',en:'Marquee',fields:[F.list('每條帶子的字（一行一條，最多 6 條）',6)],d:{list:['今晚開賣','新品上市','預購中','最後一天'],...C(YEL,INK,YEL)},dur:6,

{id:'tunnel',cat:'depth',zh:'文字隧道',en:'Text Tunnel',fields:[F.text()],d:{text:'宇宙',...C(INK,RED,RED)},dur:4,

 build(st,inst,P){const c=$el('div','fill e-tunnel');c.style.fontSize=fsz(17,P.text,52);const L=[];for(let i=0;i<7;i++){const f=$el('div','fr',esc(P.text));c.append(f);L.push(f);}st.append(c);
  return t=>{L.forEach((f,i)=>{const ph=((i/7)+t*.26)%1,s=.1*Math.pow(70,ph),o=ph<.12?ph/.12:ph>.5?Math.max(0,1-(ph-.5)/.3):1;
   f.style.transform=`scale(${s.toFixed(3)})`;f.style.opacity=o.toFixed(3);f.style.zIndex=Math.round(ph*100);});};}},

{id:'corridor',cat:'depth',zh:'文字走廊',en:'Text Corridor',fields:[F.text()],d:{text:'前進',...C(RED,INK,INK)},dur:4,
 how:'用單點透視做一條走廊，地板、天花板和左右牆面都排滿重複的字，字一排排朝鏡頭移動，遠處淡出。',
 build(st,inst,P){const cv=$el('canvas');st.append(cv);const ctx=cv.getContext('2d');const ch=[...String(P.text).replace(/\s/g,''),'・'];loadFont(P,ch.join(''));
  const dz=.55,zN=.35,zF=9,step=.46,n=Math.ceil((zF-zN)/dz),m=ch.length;
  return t=>{fit(cv,inst);const W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);const cx=W/2,cy=H/2,f=Math.min(H,W*.75)*.5,XW=Math.max(1.4,2.4*(W/H)/1.78);const s=t*1.2,off=s%dz,base=Math.floor(s/dz);
   ctx.textAlign='center';ctx.textBaseline='middle';const J=Math.ceil(XW/step),JY=Math.ceil((H/2)/f/step*1.2),YW=(H/2)/f*1.05;
   for(let k=n-1;k>=0;k--){const z=zN+(k+1)*dz-off,a=clamp((zF-z)/(zF*.55))*clamp((z-zN)/.25);if(a<=.01)continue;
    const size=f*.34*P.k/z,id=k+base;ctx.font=canvasFont(P,size);ctx.fillStyle=rgba(P.fg,a.toFixed(3));
    for(let j=-J;j<=J;j++){const x=cx+f*(j*step)/z;if(x<-size||x>W+size)continue;const c=ch[((id+j)%m+m)%m];ctx.fillText(c,x,cy+f*YW/z);ctx.fillText(c,x,cy-f*YW/z);}
    for(let j=-JY;j<=JY;j++){if(Math.abs(j*step)>YW)continue;const y=cy+f*(j*step)/z,c=ch[((id+j)%m+m)%m],xl=cx-f*XW/z,xr=cx+f*XW/z;if(xl>-size)ctx.fillText(c,xl,y);if(xr<W+size)ctx.fillText(c,xr,y);}}};}},

{id:'cyl',cat:'depth',zh:'圓柱',en:'Text Cylinder',fields:[F.text('文字（每個字一根圓柱，最多 6 字）')],d:{text:'轉圈動',...C(WHT,INK,RED)},dur:5,
 how:'每個字是一根貼滿同一個字的 3D 圓柱，繞水平軸旋轉，中間那根部分字面換強調色，相鄰圓柱反方向轉。',
 build(st,inst,P){const cs=chars(P.text).slice(0,6);if(!cs.length)cs.push('字');const n=cs.length,mid=Math.floor(n/2),N=8;
  const mk=(ch,alt)=>{let f='';for(let i=0;i<N;i++)f+=`<div class="face${alt&&i%2===0?' hot':''}" style="transform:rotateX(${i*360/N}deg) translateZ(calc(var(--cw) * 1.046))">${esc(ch)}</div>`;
   return `<div class="cyl"><div class="drum">${f}</div></div>`;};
  const box=$el('div','e-cyl',cs.map((c,i)=>mk(c,i===mid)).join(''));box.style.setProperty('--cw',`min(calc(30cqh * var(--k)),${(62/n).toFixed(2)}cqw)`);st.append(box);
  const drums=[...box.querySelectorAll('.drum')].map((d,i)=>({d,faces:[...d.children],per:i===mid?4:5,dir:i%2?-1:1}));
  return t=>{drums.forEach(D=>{const a=(t/D.per*360*D.dir)%360;D.d.style.transform=`rotateX(${a.toFixed(2)}deg)`;
   D.faces.forEach((f,k)=>{const v=Math.cos((k*360/N+a)*Math.PI/180)>.02;f.style.visibility=v?'visible':'hidden';});});};}},

{id:'vortex',cat:'depth',zh:'漩渦',en:'Text Vortex',fields:[F.text()],d:{text:'漩渦',...C(INK,RED,WHT)},dur:4.2,
 how:'主字在前，後面疊多層外框殘影，每層旋轉角度和放大比例遞增，整組來回扭轉，像被捲進漩渦。',

  return t=>{const a=Math.sin(t*1.5)*40,sp=Math.sin(t*.7)*30;L.forEach((b,i)=>{const k=i/8;
   b.style.transform=`rotate(${(a*k*1.6+sp*k+(i?0:a*.12)).toFixed(2)}deg) scale(${(1+k*.6).toFixed(3)})`;b.style.opacity=i?(.6*(1-k)+.06).toFixed(3):1;});};}},

{id:'ring',cat:'depth',zh:'圓環隧道',en:'Ring Text Tunnel',fields:[F.text()],d:{text:'時空隧道入口',...C(COB,WHT,YEL)},dur:5,
 how:'文字沿著圓周排成環，好幾個環從中心往外擴張迎面而來，相鄰的環旋轉方向相反，靠近邊緣時淡出。',
 build(st,inst,P){const cv=$el('canvas');st.append(cv);const ctx=cv.getContext('2d');const ch=[...String(P.text).replace(/\s/g,''),'・'];loadFont(P,ch.join(''));
  const m=ch.length,S=m>=14?m:m*Math.ceil(14/m);
  return t=>{fit(cv,inst);const W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);const cx=W/2,cy=H/2,R=Math.hypot(W,H)*.6,N=7;
   const rs=[];for(let i=0;i<N;i++)rs.push([i,((i/N)+t*.14)%1]);rs.sort((a,b)=>a[1]-b[1]);ctx.textAlign='center';ctx.textBaseline='middle';
   for(const[i,ph]of rs){const r=R*.05*Math.pow(20,ph),size=r*2*Math.PI/S/1.15*P.k,a=clamp(ph/.18)*clamp((1-ph)/.25);if(a<=.01)continue;
    ctx.font=canvasFont(P,size);ctx.fillStyle=rgba(i%2?P.ac:P.fg,a.toFixed(3));const rot=t*.45*(i%2?1:-1)+i*.7;
    for(let j=0;j<S;j++){const g=rot+j*2*Math.PI/S;ctx.save();ctx.translate(cx+Math.cos(g)*r,cy+Math.sin(g)*r);ctx.rotate(g+Math.PI/2);ctx.fillText(ch[j%m],0,0);ctx.restore();}}
   const md=Math.min(W,H);ctx.fillStyle=rgba(P.fg,.4);for(let j=0;j<12;j++){const g=t*.8+j*Math.PI/6;ctx.beginPath();ctx.arc(cx+Math.cos(g)*md*.07,cy+Math.sin(g)*md*.07,md*.007,0,7);ctx.fill();}};}},

{id:'orbit',cat:'depth',zh:'軌道',en:'Text Orbit',fields:[F.text()],d:{text:'軌道',...C(YEL,INK,INK)},dur:5,
 how:'畫一條虛線橢圓軌道，字沿著軌道繞行，轉到前方時變大變清楚並蓋在軌道上，轉到後方時變小變淡、被軌道壓住。',
 build(st,inst,P){const ry=Math.min(.22,.136*inst.w/inst.h);st.insertAdjacentHTML('beforeend',`<svg class="e-orbit-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="50" cy="50" rx="34" ry="${(ry*100).toFixed(2)}" fill="none" stroke="${P.ac}" stroke-width="1.6" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/></svg>`);
  const b=$el('b','e-orbit',esc(P.text));b.style.fontSize=fsz(26,P.text,36);st.append(b);
  return t=>{const g=t*1.25,x=inst.w*(.5+.34*Math.cos(g)),y=inst.h*(.5+ry*Math.sin(g)),d=(Math.sin(g)+1)/2;
   b.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%) scale(${(.6+.52*d).toFixed(3)})`;b.style.opacity=(.4+.6*d).toFixed(3);b.style.zIndex=d>.5?2:0;};}},

{id:'cube',cat:'depth',zh:'方塊',en:'Text Cube',fields:[F.list('四個面的字（一行一個）',4)],d:{list:['春','夏','秋','冬'],...C(WHT,INK,RED)},dur:5.2,
 how:'一個 3D 方塊四個面各寫一個字、底色交錯，每隔一拍往前翻轉 90 度換到下一面，翻完停一下。',
 build(st,inst,P){const W=[0,1,2,3].map(i=>P.list[i%P.list.length]);
  const faces=W.map((w,i)=>`<div class="cf${i%2?' d':''}" style="transform:rotateX(${i*90}deg) translateZ(calc(var(--cs) / 2));font-size:calc(var(--cs) * ${Math.min(.58,.82/tlen(w)).toFixed(3)})">${esc(w)}</div>`).join('');
  const box=$el('div','fill e-cube',`<div class="cube">${faces}<div class="cf cap" style="transform:rotateY(90deg) translateZ(calc(var(--cs) / 2))"></div><div class="cf cap" style="transform:rotateY(-90deg) translateZ(calc(var(--cs) / 2))"></div></div>`);
  box.style.setProperty('--cs','min(calc(52cqh * var(--k)),50cqw)');st.append(box);const cube=box.firstChild,fs=[...cube.children];fs[5].style.visibility='hidden';
  return t=>{const D=1.3,step=Math.floor(t/D),f=(t%D)/D,q=f<.42?EZ.io(f/.42):1,a=(step+q)*90;cube.style.transform=`rotateY(-24deg) rotateX(${(-a).toFixed(2)}deg)`;
   for(let k=0;k<4;k++)fs[k].style.visibility=Math.cos((k*90-a)*Math.PI/180)>.02?'visible':'hidden';};}},

{id:'extrude',cat:'depth',zh:'立體字',en:'Extrude Text',fields:[F.text()],d:{text:'立體',...C(INK,'#EAE2D3',RED)},dur:5.7,
 how:'把字往後疊十幾層、顏色逐層加深做出厚度，整個立體字繞垂直軸左右擺動，露出側面。',
 build(st,inst,P){const L=16;let h='';for(let i=L;i>=0;i--){const col=i===0?'var(--ac)':`color-mix(in srgb,var(--fg) ${(100-i*3.2).toFixed(1)}%,#000)`;h+=`<b style="transform:translateZ(calc(${(-i*.015).toFixed(3)}em));color:${col}">${esc(P.text)}</b>`;}
  const w=$el('div','ex',h),c=$el('div','fill e-ext');c.style.fontSize=fsz(36,P.text,66);c.style.perspective='4em';c.append(w);st.append(c);
  return t=>{w.style.transform=`rotateY(${(Math.sin(t*1.1)*38).toFixed(2)}deg) rotateX(${(Math.sin(t*.8)*12).toFixed(2)}deg)`;};}},

/* ================= SWITCH ================= */
{id:'flap',cat:'switch',zh:'翻牌',en:'Split Flap',fields:[F.list('輪流翻出的詞（一行一個）',6)],d:{list:['今日發車','往台中站','末班列車'],...C(INK,CRM,INK)},dur:P=>(4.2)*P.list.length,
 how:'每個字是一張上下兩半的字牌，上半片沿中線往下翻、露出下一個字，連續翻過幾個隨機字後依序停在目標字，字牌之間錯開時間。',
 build(st,inst,P){const latin=P.list.every(isLatin),n=Math.min(12,Math.max(...P.list.map(w=>[...w].length))),words=padTo(P.list,n,latin);
  const pool=latin?[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789']:[...'東西南北台中高雄新竹站車班次延誤準點月日時分'];
  const box=$el('div','e-flap');box.style.setProperty('--tw',`min(calc(30cqh * var(--k)),${(86/(n*1.08)).toFixed(2)}cqw)`);st.append(box);
  const tiles=Array.from({length:n},()=>{const T=$el('div','tile','<div class="h top"><span></span></div><div class="h bot"><span></span></div><div class="h top ft"><span></span></div><div class="h bot fb"><span></span></div>');box.append(T);
   const[a,b,c,d]=[...T.children];return{top:a.firstChild,bot:b.firstChild,ftEl:c,fbEl:d,ft:c.firstChild,fb:d.firstChild};});
  const D=4.2,fl=.085,m=words.length;let cache=-1,seqs=[];
  return t=>{const cyc=Math.floor(t/D),u=t%D;
   if(cyc!==cache){cache=cyc;const tg=words[cyc%m],pv=cyc===0?Array(n).fill(latin?' ':'\u3000'):words[(cyc+m-1)%m];seqs=tiles.map((_,i)=>{const r=rng(cyc*31+i*7+1),k=5+(i%4)*2,s=[pv[i]];for(let j=1;j<k;j++)s.push(pool[Math.floor(r()*pool.length)]);s.push(tg[i]);return s;});}
   tiles.forEach((T,i)=>{const s=seqs[i],k=s.length-1,v=u-i*.12;let o,nw,p=1;
    if(v<0){o=nw=s[0];}else{const j=Math.floor(v/fl);if(j>=k){o=nw=s[k];}else{o=s[j];nw=s[j+1];p=(v%fl)/fl;}}
    setT(T.top,nw);setT(T.bot,p>=1?nw:o);setT(T.ft,o);setT(T.fb,nw);
    if(p>=1){T.ftEl.style.visibility='hidden';T.fbEl.style.visibility='hidden';}
    else if(p<.5){T.ftEl.style.visibility='visible';T.ftEl.style.transform=`rotateX(${(-180*p).toFixed(1)}deg)`;T.fbEl.style.visibility='hidden';}
    else{T.ftEl.style.visibility='hidden';T.fbEl.style.visibility='visible';T.fbEl.style.transform=`rotateX(${(180*(1-p)).toFixed(1)}deg)`;}});};}},

{id:'cards',cat:'switch',zh:'翻卡',en:'Flip Cards',fields:[F.text('正面'),F.text2('背面')],d:{text:'向前走',text2:'不回頭',...C(YEL,INK,WHT)},dur:4,
 how:'幾張字卡繞垂直軸翻轉 180 度，正反面各寫一個字、底色深淺相反，卡片之間錯開一點時間依序翻。',
 build(st,inst,P){const a=chars(P.text),b=chars(P.text2),n=Math.min(10,Math.max(a.length,b.length,1)),latin=isLatin(P.text+P.text2),[A,B]=padTo([a.join(''),b.join('')],n,latin);
  const box=$el('div','e-cards',A.map((c,i)=>`<div class="card"><div class="in"><b class="f">${esc(c)}</b><b class="b">${esc(B[i])}</b></div></div>`).join(''));
  box.style.setProperty('--cw',`min(calc(30cqh * var(--k)),${(84/(n*1.1)).toFixed(2)}cqw)`);st.append(box);
  const cards=[...box.querySelectorAll('.in')].map(el=>({el,f:el.children[0],b:el.children[1]}));
  const back=p=>{const c1=1.70158*1.525;return p<.5?(Math.pow(2*p,2)*((c1+1)*2*p-c1))/2:(Math.pow(2*p-2,2)*((c1+1)*(p*2-2)+c1)+2)/2;};
  const ang=p=>p<.18?0:p<.38?180*back((p-.18)/.2):p<.68?180:p<.88?180+180*back((p-.68)/.2):360;
  return t=>{cards.forEach((C,i)=>{const u=t-i*.16,p=u<0?0:(u%4)/4,g=ang(p);C.el.style.transform=`rotateY(${g.toFixed(2)}deg)`;const front=Math.cos(g*Math.PI/180)>=0;
   C.f.style.visibility=front?'visible':'hidden';C.b.style.visibility=front?'hidden':'visible';});};}},

{id:'type',cat:'switch',zh:'打字機',en:'Typewriter',fields:[F.list('每行一句（最多 4 行）',4)],d:{list:['夜色漸深','故事才開始'],font:'serif',...C(WHT,INK,INK)},
 dur:P=>{const n=P.list.reduce((a,s)=>a+[...s].length,0);return n*.14+.3*(P.list.length-1)+1.5+n*.045+.6;},
 how:'文字一個字一個字出現，游標跟在最後並閃爍，打完全部停一下，再快速倒退刪除後重新開始。',
 build(st,inst,P){const L=P.list.slice(0,4).map(s=>[...s]),c=$el('div','e-type'),rows=L.map(()=>$el('div')),cur=$el('i','cur');rows.forEach(r=>c.append(r));st.append(c);
  c.style.fontSize=`min(calc(${(15*Math.min(1,2.4/L.length)).toFixed(1)}cqh * var(--k)),${(80/tlen(longest(L.map(a=>a.join(''))))).toFixed(2)}cqw)`;
  const ct=.14,gap=.3,hold=1.5,del=.045,rest=.6,N=L.reduce((a,r)=>a+r.length,0),tType=N*ct+gap*(L.length-1),P1=tType+hold,P2=P1+N*del,PP=P2+rest;let key='';
  return t=>{const u=t%PP;let shown;
   if(u<tType){let acc=0,rem=u;shown=0;for(let i=0;i<L.length;i++){const need=L[i].length*ct;if(rem<need){shown=acc+Math.floor(rem/ct);break;}rem-=need;acc+=L[i].length;shown=acc;if(i<L.length-1){if(rem<gap)break;rem-=gap;}}}
   else if(u<P1)shown=N;else if(u<P2)shown=N-Math.floor((u-P1)/del);else shown=0;
   const k=String(shown);if(k===key)return;key=k;let left=shown,active=0;
   L.forEach((r,i)=>{const c=Math.max(0,Math.min(r.length,left));rows[i].textContent=r.slice(0,c).join('');if(left>0)active=i;left-=r.length;});

const mgPrimary=fx=>fx.fields.some(f=>f.k==='list')?'list':fx.fields[0].k;
function mgApplyWords(fx,p,words){
  const w=(words||[]).map(s=>String(s).trim()).filter(Boolean);if(!w.length)return p;const k=mgPrimary(fx);
  if(k==='list')p.list=w.slice(0,(fx.fields.find(f=>f.k==='list')||{}).max||8);
  else if(k==='text'){p.text=w[0];if(fx.fields.some(f=>f.k==='text2')&&w[1])p.text2=w[1];}
  else if(k==='num'){const n=Number(String(w[0]).replace(/[,，\s]/g,''));if(isFinite(n)&&n>0)p.num=Math.round(n);}
  return p;
}
const mgSplitWords=s=>String(s||'').split(/\s*[|｜\n]\s*/).map(x=>x.trim()).filter(Boolean);

/* mount one effect into a container; render it at a given time */
function mgMount(parent,sc,w,h){
  const fx=MG_MAP[sc.fx]||MG_FX[0],P=mgResolve(sc),el=$el('div','mg-stage');
  el.style.setProperty('--bg',P.bg);el.style.setProperty('--fg',P.fg);el.style.setProperty('--ac',P.ac);el.style.setProperty('--k',P.k);const fm=fontMeta(P.font);el.style.setProperty('--ff',fm.css);el.style.setProperty('--fw',fm.w);
  parent.append(el);const inst={w:w||1,h:h||1};let tick=null;try{tick=fx.build(el,inst,P)||null;}catch(e){console.error(fx.id,e);}
  const L={sc,el,inst,tick,P,lt:0,anims:null};L.mo=new MutationObserver(()=>{L.anims=null;});L.mo.observe(el,{childList:true,subtree:true});return L;
}
function mgRender(L){const tt=L.lt*L.P.speed;if(L.tick)L.tick(tt);
  if(!L.anims){L.anims=L.el.getAnimations?L.el.getAnimations({subtree:true}):[];L.anims.forEach(a=>{try{a.pause();}catch(e){}});}
  for(const a of L.anims){try{a.currentTime=tt*1000;}catch(e){}}}
function mgUnmount(L){if(!L)return;L.mo.disconnect();L.el.remove();}

/* ===== Player: one frame, a list of scenes, a clock that drives JS and CSS animation together ===== */
class MGPlayer{
  constructor(host,{aspect='16:9',onTick=null}={}){
    this.host=host;host.classList.add('mg-host');this.frame=$el('div','mg-frame');host.append(this.frame);
    this.aspect=aspect;this.scenes=[];this.layers=[];this.T=0;this.local=0;this.mode='all';this.sel=0;this.playing=true;this.active=true;this.jump=true;this.onTick=onTick;this.fw=0;this.fh=0;
    this.ro=new ResizeObserver(()=>this.layout());this.ro.observe(host);this.layout();
    let last=performance.now();const loop=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;try{this.step(dt);}catch(e){console.error(e);}requestAnimationFrame(loop);};requestAnimationFrame(loop);
  }
  get total(){return this.scenes.reduce((a,s)=>a+(+s.dur||0),0);}
  layout(){const W=this.host.clientWidth,H=this.host.clientHeight;if(!W||!H)return;let w=W,h=H;
    if(this.aspect!=='fill'){const[aw,ah]=this.aspect.split(':').map(Number);w=W;h=W*ah/aw;if(h>H){h=H;w=H*aw/ah;}}
    w=Math.floor(w);h=Math.floor(h);if(w===this.fw&&h===this.fh)return;
    const arChanged=this.fw&&Math.abs(w/h-this.fw/this.fh)>.02;this.fw=w;this.fh=h;this.frame.style.width=w+'px';this.frame.style.height=h+'px';
    this.layers.forEach(L=>{L.inst.w=w;L.inst.h=h;});if(arChanged)this.reset();}
  setAspect(a){if(a===this.aspect)return;this.aspect=a;this.fw=0;this.layout();this.reset();}
  setScenes(sc){this.scenes=sc;if(this.mode==='all'&&this.T>=this.total)this.T=0;}
  reset(){this.layers.forEach(mgUnmount);this.layers=[];this.jump=true;}
  select(i){this.mode='single';this.sel=i;this.local=0;this.jump=true;}
  playAll(from=0){this.mode='all';this.T=from;this.jump=true;this.playing=true;}
  seek(T){this.mode='all';this.T=clamp(T,0,Math.max(0,this.total-.001));this.jump=true;}
  locate(){const n=this.scenes.length;if(this.mode==='single'){const i=Math.min(this.sel,n-1);return{i,t:this.local,start:0};}
    let acc=0;for(let i=0;i<n;i++){const d=+this.scenes[i].dur||0;if(this.T<acc+d)return{i,t:this.T-acc,start:acc};acc+=d;}return{i:n-1,t:0,start:acc};}
  step(dt){
    if(!this.active||!this.scenes.length||!this.fw){return;}
    if(this.playing){if(this.mode==='single'){this.local+=dt;const d=+this.scenes[Math.min(this.sel,this.scenes.length-1)].dur||1;if(this.local>=d){this.local%=d;this.jump=true;}}
      else{this.T+=dt;const tot=this.total;if(this.T>=tot){this.T%=tot;this.jump=true;}}}
    const{i,t,start}=this.locate(),sc=this.scenes[i];let top=this.layers[this.layers.length-1];
    if(!top||top.i!==i||top.rev!==sc.rev||top.id!==sc.id||(this.jump&&t<.06)||(this.jump&&top.i!==i)){
      const fade=top&&this.playing&&!this.jump&&top.i!==i&&sc.trans==='fade';
      if(!fade||(top&&top.id===sc.id))this.reset();
      const L=this.make(i);L.fade=!!fade;this.layers.push(L);top=L;if(L.fade)L.el.style.opacity=0;
    }
    this.jump=false;
    top.lt=t;
    if(top.fade){const o=clamp(t/.45);top.el.style.opacity=o.toFixed(3);if(o>=1){this.layers.slice(0,-1).forEach(mgUnmount);this.layers=[top];top.fade=false;top.el.style.opacity='';}}
    for(const L of this.layers)this.render(L);
    if(this.onTick)this.onTick({i,t,T:this.mode==='all'?this.T:start+t,total:this.total,mode:this.mode});
  }
  make(i){const sc=this.scenes[i],L=mgMount(this.frame,sc,this.fw,this.fh);L.i=i;L.id=sc.id;L.rev=sc.rev;return L;}
  render(L){mgRender(L);}
}

{id:'lx-dust',cat:'lustre',zh:'金粉聚合',en:'Gold Dust Assemble',desc:'細細的金粉從四周飄來，聚成文字。',use:'開場、節慶',fields:[F.text()],d:{text:'Éclat',font:'elegant',...C(LXC.IV,LXC.ESP,LXC.CHA)},dur:6.5,

 build(st,inst,P){const cv=$el('canvas');st.append(cv);const ctx=cv.getContext('2d');let pts=[],key='',fs=40;const D=6.5,light=mixHex(P.ac,'#ffffff',.55);
  const prep=()=>{const W=cv.width,H=cv.height;fs=Math.min(H*.34*P.k,W*.8/tlen(P.text));const o=document.createElement('canvas');o.width=W;o.height=H;const oc=o.getContext('2d');oc.font=canvasFont(P,fs,400);oc.textAlign='center';oc.textBaseline='middle';oc.fillText(P.text,W/2,H/2);
   const d=oc.getImageData(0,0,W,H).data;let step=Math.max(2,Math.round(Math.sqrt(W*H/120000)*2)),L=[];
   for(;;){L=[];for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step)if(d[(y*W+x)*4+3]>128)L.push([x,y]);if(L.length<=1800)break;step++;}

   for(const q of pts){const a=LE.o3(sg(p,.02+q.dl,.42+q.dl*.5));const al=a*(1-out)*(.55+.45*Math.sin(t*3+q.tw)*(hold?1:.3));if(al<.02)continue;
    const x=q.sx+(q.x-q.sx)*a+out*(q.c-.5)*W*.08,y=q.sy+(q.y-q.sy)*a-out*(.05+q.c*.12)*H,s=q.sz*dpr*1.1;ctx.globalAlpha=al;ctx.fillStyle=q.c>.7?light:P.ac;ctx.fillRect(x-s/2,y-s/2,s,s);}
   const ta=sg(p,.38,.55)*(1-sg(p,.76,.86));if(ta>0){ctx.globalAlpha=ta;ctx.font=canvasFont(P,fs,400);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=P.ac;ctx.fillText(P.text,W/2,H/2);}ctx.globalAlpha=1;};}},

<script>
(()=>{
const KEY='mg-mix-v1';
